<style>
  :root {
    --lima: #B6E300;
    --morado: #2E1A47;
    --blanco: #FFFFFF;
    --gris-claro: #F8F9FA;
    --sombra: rgba(46, 26, 71, 0.1);
  }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--gris-claro);
    color: var(--morado);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 800px;
    padding: 20px;
    box-sizing: border-box;
  }

  .card {
    background: var(--blanco);
    border-radius: 12px;
    box-shadow: 0 8px 30px var(--sombra);
    padding: 30px;
    margin-bottom: 20px;
    transition: transform 0.3s ease;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    color: var(--morado);
  }

  .header p {
    font-size: 12px;
    color: #888;
    margin-top: 5px;
  }

  /* Login Styles */
  .login-container {
    max-width: 400px;
    margin: 0 auto;
  }

  .form-group {
    margin-bottom: 15px;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 12px;
    background-color: var(--lima);
    color: var(--morado);
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
    font-family: inherit;
  }

  button:hover {
    filter: brightness(0.95);
  }

  /* Search Styles */
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .search-input {
    flex: 1;
    font-size: 16px !important;
  }

  .search-btn {
    width: auto;
    padding: 0 25px;
  }

  /* Results Card */
  .result-card {
    border-left: 5px solid var(--lima);
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
  }

  .result-item {
    font-size: 13px;
  }

  .result-label {
    font-weight: 600;
    color: #666;
    display: block;
    margin-bottom: 2px;
  }

  .fuente-tag {
    display: inline-block;
    background: #eee;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    margin-top: 10px;
  }

  /* Reminder Banner */
  .reminder-banner {
    background-color: #FFF9C4;
    padding: 15px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  /* Accordion */
  .accordion {
    border: 1px solid #eee;
    border-radius: 8px;
    overflow: hidden;
  }

  .accordion-header {
    background: #fff;
    padding: 12px 15px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
  }

  .accordion-content {
    display: none;
    padding: 15px;
    background: #fafafa;
    border-top: 1px solid #eee;
  }

  .accordion-content ul {
    margin: 0;
    padding-left: 20px;
    font-size: 13px;
  }

  .accordion-content li {
    margin-bottom: 5px;
  }

  /* Loader */
  .loader {
    display: none;
    text-align: center;
    padding: 20px;
  }

  .spinner {
    border: 4px solid rgba(0, 0, 0, 0.1);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border-left-color: var(--lima);
    animation: spin 1s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Transitions */
  .fade-in {
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .error-msg {
    color: #d32f2f;
    font-size: 12px;
    margin-top: 5px;
    text-align: center;
  }
</style>
