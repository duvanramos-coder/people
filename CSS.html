<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

  :root {
    --lima: #B6E300;
    --morado-profundo: #1A0B2E;
    --morado-claro: #2E1A47;
    --accent: #D4FF00;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-glow: 0 0 10px rgba(182, 227, 0, 0.5);
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top right, #2E1A47, #1A0B2E);
    color: #FFFFFF;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* Glassmorphism Background Elements */
  body::before {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 40%; height: 40%;
    background: var(--lima);
    filter: blur(150px);
    opacity: 0.15;
    z-index: -1;
  }

  .container {
    width: 100%;
    max-width: 900px;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1;
  }

  .card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    margin-bottom: 25px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(182, 227, 0, 0.3);
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }

  .header h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(to right, #FFFFFF, var(--lima));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
  }

  .header p {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 8px;
  }

  /* Inputs & Selects */
  select, input {
    width: 100%;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 15px 20px;
    color: white;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
    margin-bottom: 15px;
  }

  select option {
    background: var(--morado-profundo);
    color: white;
  }

  select:focus, input:focus {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--lima);
    box-shadow: 0 0 15px rgba(182, 227, 0, 0.2);
  }

  /* Buttons */
  .btn-primary {
    width: 100%;
    background: var(--lima);
    color: var(--morado-profundo);
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 10px 20px rgba(182, 227, 0, 0.2);
  }

  .btn-primary:hover {
    transform: scale(1.02);
    background: var(--accent);
    box-shadow: 0 15px 25px rgba(182, 227, 0, 0.4);
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--glass-border);
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-outline:hover {
    background: var(--glass-border);
    border-color: white;
  }

  /* Search Section */
  .search-wrapper {
    display: flex;
    gap: 12px;
  }

  .search-input {
    flex: 1;
    margin-bottom: 0;
  }

  .search-btn {
    width: auto;
    padding: 0 30px;
  }

  /* Result Card Styles */
  .result-container {
    border-left: 4px solid var(--lima);
    position: relative;
    padding-left: 25px;
  }

  .resumen-box {
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    border: 1px dashed var(--glass-border);
    font-style: italic;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .label-neon {
    color: var(--lima);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: block;
    margin-bottom: 8px;
    text-shadow: var(--text-glow);
  }

  .value-text {
    font-size: 15px;
    line-height: 1.6;
    color: white;
  }

  /* Navigation Pills */
  .nav-pills {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
  }

  .pill {
    padding: 6px 15px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  .pill.active {
    background: var(--lima);
    color: var(--morado-profundo);
    font-weight: 600;
  }

  /* Accordion Next-Gen */
  .accordion-ng {
    background: var(--glass);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
  }

  .accordion-ng-header {
    padding: 20px 25px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
  }

  .accordion-ng-content {
    padding: 0 25px 25px;
    display: none;
    border-top: 1px solid var(--glass-border);
    padding-top: 20px;
  }

  .accordion-ng-content ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .accordion-ng-content li {
    padding: 8px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
  }

  .accordion-ng-content li::before {
    content: '✦';
    color: var(--lima);
    font-size: 10px;
  }

  /* Animations */
  .fade-up {
    animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loader-ring {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: var(--lima);
    animation: spin 1s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Banner Minimalista */
  .banner-smart {
    background: linear-gradient(90deg, rgba(182,227,0,0.1), transparent);
    border-left: 2px solid var(--lima);
    padding: 15px 20px;
    border-radius: 0 12px 12px 0;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 20px 0;
  }

  .logout-area {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .user-chip {
    background: var(--glass-border);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
  }
</style>
