<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800&display=swap');

  :root {
    --primary: #1A1231;
    --primary-light: #2A1F4D;
    --secondary: #B5E61D;
    --secondary-dark: #9AC418;
    --accent: #6366f1;
    --bg-main: #f1f5f9;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --radius-md: 14px;
    --radius-lg: 24px;
    --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    --error: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight: 800; }

  /* --- Login Redesign --- */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #241D3B; /* Color de fondo oscuro */
    padding: 1.5rem;
    position: relative;
  }

  .login-container-premium {
    display: flex;
    width: 100%;
    max-width: 900px;
    min-height: 550px;
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-premium);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 10;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Panel Izquierdo */
  .login-left-panel {
    flex: 1;
    background: linear-gradient(135deg, #241D3B, #3B2E60);
    padding: 4rem 3rem;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--white);
    overflow: hidden;
  }

  .branding-content {
    position: relative;
    z-index: 5;
  }

  .logo-box-premium {
    background: var(--secondary);
    color: var(--primary);
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    margin-bottom: 2rem;
    box-shadow: 0 10px 20px rgba(181, 230, 29, 0.3);
  }
  .logo-box-premium i { width: 32px; height: 32px; }

  .welcome-label {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 0.5rem;
  }

  .brand-title {
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
    letter-spacing: -1px;
    color: var(--white);
  }

  .brand-description {
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.8);
    max-width: 280px;
  }

  /* Esferas Decorativas */
  .decoration-sphere {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3B2E60, #1A1231);
    box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5), 10px 10px 30px rgba(0,0,0,0.3);
  }

  .sphere-1 { width: 200px; height: 200px; bottom: -50px; left: -50px; }
  .sphere-2 { width: 120px; height: 120px; top: 100px; right: -40px; opacity: 0.6; }
  .sphere-3 { width: 80px; height: 80px; bottom: 150px; left: 80px; opacity: 0.4; }

  /* Panel Derecho */
  .login-right-panel {
    flex: 1;
    padding: 4rem 3.5rem;
    display: flex;
    align-items: center;
  }

  .login-form-box { width: 100%; }

  .form-title {
    font-size: 2rem;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }

  .form-subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 2.5rem;
  }

  .form-group-premium { margin-bottom: 1.5rem; }

  .premium-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 0.6rem;
    letter-spacing: 0.5px;
  }

  .premium-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .premium-input-wrapper .input-icon {
    position: absolute;
    left: 1rem;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
  }

  .premium-input-wrapper input,
  .premium-input-wrapper select {
    width: 100%;
    padding: 0.9rem 1rem 0.9rem 3rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    background: #F8FAFC;
    transition: all 0.3s;
    outline: none;
    appearance: none;
  }

  .premium-input-wrapper input:focus,
  .premium-input-wrapper select:focus {
    background: var(--white);
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(26, 18, 49, 0.05);
  }

  .btn-toggle-pass {
    position: absolute;
    right: 1rem;
    background: none;
    border: none;
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--primary);
    cursor: pointer;
    letter-spacing: 1px;
  }

  .btn-auth-premium {
    width: 100%;
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 1.1rem;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 2.5rem;
  }
  .btn-auth-premium:hover {
    background: #241D3B;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(26, 18, 49, 0.2);
  }

  .error-box-premium {
    margin-top: 1.5rem;
    padding: 1rem;
    background: #FEF2F2;
    color: var(--error);
    border-radius: 10px;
    font-size: 0.85rem;
    text-align: center;
    font-weight: 600;
  }

  .login-footer-fixed {
    position: absolute;
    bottom: 2rem;
    font-size: 0.7rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 1px;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }

  /* Media Queries */
  @media (max-width: 768px) {
    .login-container-premium { flex-direction: column; max-width: 450px; }
    .login-left-panel { padding: 3rem 2.5rem; }
    .login-right-panel { padding: 3rem 2.5rem; }
    .brand-title { font-size: 2rem; }
  }

  /* --- Estilos compartidos para Dashboard y AgentPortal --- */
  /* (Se mantienen los estilos premium anteriores adaptándolos a la nueva paleta) */

  .card-premium {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border);
  }

  .btn-action-premium {
    background-color: var(--primary);
    color: var(--white);
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-action-premium:hover { background-color: var(--primary-light); transform: translateY(-1px); }

  .status-pill.green { background: #E8F5E9; color: #2E7D32; }
  .status-pill.red { background: #FFEBEE; color: #C62828; }
  .status-pill.warning { background: #FFF8E1; color: #F9A825; }

  .loader-overlay-premium {
    position: fixed;
    inset: 0;
    background: rgba(26, 18, 49, 0.9);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--white);
  }
  .spinner-premium {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--secondary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 1.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Agregando estilos faltantes de la versión anterior para compatibilidad */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .modal-content {
    background: var(--white);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 600px;
    padding: 2.5rem;
    box-shadow: var(--shadow-premium);
  }
</style>
