<style>
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --accent: #38bdf8;
  --accent-hover: #7dd3fc;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: rgba(255,255,255,0.08);
  --success: #22c55e;
  --error: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* Transitions */
.fade-in { animation: fadeIn 0.4s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Layout */
.dashboard-container { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  background: rgba(15, 23, 42, 0.95);
  border-right: 1px solid var(--border);
  padding: 2.5rem 1.5rem;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.main-content {
  flex: 1;
  padding: 3rem 4rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* Sidebar Nav */
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  color: var(--text-muted);
  text-decoration: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 500;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.nav-item.active { color: var(--accent); background: rgba(56, 189, 248, 0.08); }

/* KPI Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 1.5rem;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,0.3); }

.kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.kpi-value { font-size: 2rem; font-weight: 700; font-family: 'Inter', sans-serif; }
.kpi-trend { font-size: 0.75rem; display: flex; align-items: center; gap: 4px; }
.trend-up { color: var(--success); }
.trend-down { color: var(--error); }

/* Insights Block */
.insights-container {
  margin-bottom: 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.insight-pill {
  padding: 12px 20px;
  border-radius: 10px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  font-size: 0.875rem;
  display: flex;
  align-items: center;
  gap: 12px;
  border-left-width: 4px;
}
.insight-success { border-left-color: var(--success); }
.insight-warning { border-left-color: var(--warning); }
.insight-info { border-left-color: var(--info); }

/* Search Ficha */
.search-container { margin-bottom: 32px; position: relative; }
.search-input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 20px 14px 48px;
  color: white;
  font-size: 1rem;
  outline: none;
  transition: all 0.2s;
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
.search-icon-abs { position: absolute; left: 18px; top: 16px; color: var(--text-muted); }

.ficha-card {
  background: var(--bg-card);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 24px;
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.ficha-item label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
.ficha-item span { font-size: 1rem; font-weight: 500; }

/* Tables & Lists */
.table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 32px; }
.table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.table-title { font-size: 1.1rem; font-weight: 600; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 12px 16px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
tr:hover { background: rgba(255,255,255,0.01); }

/* Badges */
.badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
.badge-success { background: rgba(34, 197, 94, 0.1); color: var(--success); }
.badge-error { background: rgba(239, 68, 68, 0.1); color: var(--error); }
.badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
.badge-info { background: rgba(59, 130, 246, 0.1); color: var(--info); }

/* Turnos Grid */
.turnos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.turno-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.turno-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
.turno-info p { font-size: 0.75rem; color: var(--text-muted); }

/* Login Redesign */
.login-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1e293b, #0f172a); }
.login-box {
  background: var(--bg-card);
  padding: 3rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.login-box h1 { margin-bottom: 0.5rem; font-size: 1.75rem; }
.login-box p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

.input-group { text-align: left; margin-bottom: 1.5rem; }
.input-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; font-weight: 600; }
.input-group input {
  width: 100%;
  background: rgba(15,23,42,0.5);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 8px;
  color: white;
  outline: none;
}
.input-group input:focus { border-color: var(--accent); }

.btn-login {
  width: 100%;
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-login:hover { background: var(--accent-hover); transform: translateY(-1px); }

/* Loader */
.loader-overlay {
  position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 10000;
}
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 1024px) {
  .sidebar { display: none; }
  .main-content { padding: 2rem; }
}
</style>
