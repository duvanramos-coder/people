<style>
  :root {
    --primary: #2B234F;
    --accent: #CCFF00;
    --accent-hover: #b5e600;
    --bg-main: #F3F4F9;
    --sidebar-width: 260px;
    --sidebar-collapsed-width: 80px;
    --transition-speed: 0.4s;
    --shadow-premium: 0 20px 40px -15px rgba(43, 35, 79, 0.15);
    --glass: rgba(255, 255, 255, 0.7);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: -0.015em;
    background-color: var(--bg-main);
    color: #1A1D23;
    margin: 0;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Global Typography Reset */
  h1, h2, h3, h4, h5, p, span, button, input, div, iframe {
    font-style: normal !important;
    font-weight: 500;
  }

  h1, h2, h3, h4 {
    font-weight: 700;
  }

  .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Premium Glassmorphism */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  /* Sidebar States */
  .sidebar {
    width: var(--sidebar-width);
    transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .sidebar.collapsed {
    width: var(--sidebar-collapsed-width);
    padding-left: 0 !important;
    padding-right: 0 !important;
  }
  .sidebar.collapsed .sidebar-text,
  .sidebar.collapsed .sidebar-header-text {
    display: none;
  }
  .sidebar.collapsed .sidebar-nav-item {
    justify-content: center;
    padding: 1rem;
    margin: 0 0.75rem;
  }
  .sidebar.collapsed .sidebar-logo-container {
    justify-content: center;
    margin-bottom: 2rem;
  }

  /* Course Card Refinement */
  .course-card {
    background: white;
    border-radius: 2.5rem;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 20px -5px rgba(43, 35, 79, 0.03);
  }
  .course-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-premium);
    border-color: var(--accent);
  }

  /* Custom scrollbar */
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #D1D5DB;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

  /* Buttons */
  .btn-primary {
    background: var(--primary);
    color: var(--accent);
    font-weight: 700;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-primary:hover {
    transform: scale(1.03);
    box-shadow: 0 15px 30px -10px rgba(43, 35, 79, 0.3);
  }
  .btn-primary:active {
    transform: scale(0.97);
  }

  /* Status Tags */
  .tag-completed {
    background: var(--accent);
    color: var(--primary);
    font-size: 9px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Result View Refinement */
  .result-card {
    max-width: 480px;
    margin: 0 auto;
    padding: 3rem;
    border-radius: 4rem;
    background: white;
    box-shadow: var(--shadow-premium);
    text-align: center;
  }
</style>
