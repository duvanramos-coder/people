<style>
  :root {
    --primary: #7C3AED; /* Purple from image */
    --accent: #CCFF00;
    --bg-sidebar: #FFFFFF;
    --bg-main: #F8F9FB;
    --text-main: #1F2937;
    --text-muted: #6B7280;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: -0.01em;
    background-color: var(--bg-main);
    color: var(--text-main);
    margin: 0;
  }

  .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Remove all italics */
  h1, h2, h3, h4, h5, p, span, button, input, div { font-style: normal !important; }

  /* Course Card Refinement */
  .course-card {
    background: white;
    border-radius: 1.5rem;
    transition: all 0.3s ease;
    border: 1px solid #F3F4F6;
  }
  .course-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #E5E7EB;
    border-radius: 10px;
  }

  /* Banner Gradient */
  .banner-gradient {
    background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
  }

  /* Circular Progress */
  .profile-ring {
    position: relative;
    width: 100px;
    height: 100px;
  }
  .profile-ring svg {
    transform: rotate(-90deg);
  }
  .profile-ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }
  .profile-ring .bg { stroke: #F3F4F6; }
  .profile-ring .progress {
    stroke: var(--primary);
    stroke-dasharray: 283;
    stroke-dashoffset: 70; /* Example */
    transition: stroke-dashoffset 1s ease-out;
  }

  /* Sidebar Links */
  .nav-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    color: #9CA3AF;
    font-weight: 600;
    transition: all 0.2s;
    cursor: pointer;
  }
  .nav-link:hover {
    background: #F5F3FF;
    color: var(--primary);
  }
  .nav-link.active {
    background: #F5F3FF;
    color: var(--primary);
  }

  /* Buttons */
  .btn-primary {
    background: var(--primary);
    color: white;
    font-weight: 700;
    transition: all 0.2s;
  }
  .btn-primary:hover {
    filter: brightness(1.1);
    transform: scale(1.02);
  }
</style>
