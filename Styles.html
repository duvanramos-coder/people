<style>
  :root {
    --primary: #2B234F;
    --accent: #CCFF00;
    --bg-main: #F8FAFB;
    --bg-card: rgba(255, 255, 255, 0.8);
    --text-main: #1A1D23;
    --text-muted: #64748B;
    --glass-border: rgba(255, 255, 255, 0.3);
    --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    letter-spacing: -0.02em;
    background-color: var(--bg-main);
    color: var(--text-main);
  }

  /* Glassmorphism utility */
  .glass {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-soft);
  }

  .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .course-card {
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .course-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 40px rgba(43, 35, 79, 0.1);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #E2E8F0;
    border-radius: 20px;
  }
  ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }

  /* Input & Button Refinements */
  input {
    transition: all 0.3s ease;
    border: 2px solid transparent !important;
  }
  input:focus {
    border-color: var(--primary) !important;
    background: white !important;
    box-shadow: 0 0 0 4px rgba(43, 35, 79, 0.05);
  }

  .btn-primary {
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .btn-primary:after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300%;
    height: 300%;
    background: rgba(255,255,255,0.1);
    transform: translate(-50%, -50%) rotate(45deg) translateY(100%);
    transition: transform 0.6s ease;
  }
  .btn-primary:hover:after {
    transform: translate(-50%, -50%) rotate(45deg) translateY(0);
  }

  /* Remove generic bold */
  .font-black { font-weight: 800 !important; }
  .font-extrabold { font-weight: 700 !important; }
  .font-bold { font-weight: 600 !important; }
  .font-medium { font-weight: 500 !important; }

  /* Progress bar glow */
  #barraProgreso {
    box-shadow: 0 0 15px rgba(204, 255, 0, 0.4);
  }

  /* Selection style */
  ::selection {
    background: var(--accent);
    color: var(--primary);
  }
</style>
