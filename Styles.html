<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800&display=swap');

  :root {
    /* Modern Indigo & Slate Palette */
    --primary: #4f46e5; /* Indigo 600 */
    --primary-dark: #3730a3; /* Indigo 800 */
    --primary-light: #818cf8; /* Indigo 400 */
    --secondary: #b7d400;
    --secondary-dark: #a2bc00;
    --accent: #6366f1;
    --bg-main: #f8fafc; /* Slate 50 */
    --text-main: #0f172a; /* Slate 900 */
    --text-muted: #64748b; /* Slate 500 */
    --white: #ffffff;
    --glass: rgba(255, 255, 255, 0.7);
    --border: #e2e8f0;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-premium: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --error: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3, .brand-name { font-family: 'Montserrat', sans-serif; font-weight: 800; }

  /* --- Shared Utilities --- */
  .fade-in { animation: fadeIn 0.6s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); }
  .mt-1 { margin-top: 1rem; }
  .text-center { text-align: center; }

  /* --- Login Redesign (Reference Image) --- */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top right, var(--primary-light), var(--primary-dark));
    padding: 1.5rem;
  }

  .premium-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 3.5rem 2.5rem;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    text-align: center;
    border-top: 6px solid var(--secondary);
  }

  .admin-search-input-group {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
  }

  /* Modal Styles */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    animation: fadeIn 0.3s ease;
  }

  .modal-content {
    background: var(--white);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 600px;
    padding: 2rem;
    box-shadow: var(--shadow-premium);
    position: relative;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  .modal-header h3 {
    font-size: 1.25rem;
    color: var(--primary-dark);
    margin: 0;
  }

  .btn-close-modal {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.25rem;
    transition: color 0.2s;
  }

  .btn-close-modal:hover {
    color: var(--error);
  }

  .login-brand { margin-bottom: 2.5rem; }
  .logo-shield {
    background-color: var(--secondary);
    color: var(--primary);
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    margin: 0 auto 1.5rem;
    box-shadow: 0 8px 16px rgba(183, 212, 0, 0.3);
  }
  .logo-shield i { width: 35px; height: 35px; }
  .brand-welcome { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 0.5rem; }
  .brand-name { font-size: 2rem; color: var(--primary-dark); }

  .input-label { display: block; text-align: left; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.5rem; letter-spacing: 1px; }
  .input-wrapper { position: relative; margin-bottom: 1.5rem; }
  .input-icon { position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; }

  .premium-select, .premium-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    background-color: var(--white);
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text-main);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
  }
  .premium-input:focus, .premium-select:focus {
    border-color: var(--primary);
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
  }
  .input-wrapper .premium-select, .input-wrapper .premium-input { padding-left: 3rem; }

  .btn-premium-login {
    width: 100%;
    background-color: var(--primary-dark);
    color: var(--white);
    border: none;
    padding: 1.1rem;
    border-radius: var(--radius-md);
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 2rem;
  }
  .btn-premium-login:hover { transform: translateY(-2px); background-color: var(--primary); box-shadow: 0 10px 15px rgba(30, 27, 51, 0.2); }

  .btn-action-premium {
    background-color: var(--primary);
    color: var(--white);
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 0.875rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2), 0 2px 4px -1px rgba(79, 70, 229, 0.1);
  }
  .btn-action-premium:hover {
    background-color: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3), 0 4px 6px -2px rgba(79, 70, 229, 0.2);
  }

  .login-footer-premium { margin-top: 3rem; font-size: 0.65rem; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; border-top: 1px solid var(--border); padding-top: 1.5rem; }

  /* --- Agent Portal Premium --- */
  .agent-portal-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

  .sidebar-nav { background: var(--primary-dark); color: var(--white); padding: 2rem 1.5rem; display: flex; flex-direction: column; }
  .sidebar-brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; }
  .brand-logo-small { background: var(--secondary); color: var(--primary); font-weight: 800; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .brand-text h3 { font-size: 1rem; margin-bottom: -2px; }
  .brand-text p { font-size: 0.7rem; color: var(--text-muted); }

  .nav-menu { flex: 1; }
  .nav-item { padding: 0.875rem 1rem; border-radius: 12px; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; }
  .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.05); }
  .nav-item.active { background: var(--secondary); color: var(--primary-dark); font-weight: 700; box-shadow: 0 4px 12px rgba(183, 212, 0, 0.3); }
  .nav-item i { width: 18px; transition: transform 0.3s; }
  .nav-item:hover i { transform: scale(1.2); }

  .btn-logout-minimal { background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 0.75rem; border-radius: 10px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.8rem; transition: all 0.3s; }
  .btn-logout-minimal:hover { border-color: var(--error); color: var(--white); background: var(--error); transform: translateY(-2px); }

  .portal-main { padding: 2rem 3rem; background: #f1f5f9; }
  .portal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
  .welcome-banner h2 { font-size: 1.75rem; color: var(--primary-dark); }
  .welcome-banner p { color: var(--text-muted); }

  .quick-stats-row { display: flex; gap: 1.5rem; }
  .mini-stat-card { padding: 1rem 1.5rem; border-radius: 18px; display: flex; align-items: center; gap: 1rem; min-width: 200px; }
  .stat-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .stat-icon.purple { background: #e0e7ff; color: var(--accent); }
  .stat-icon.lime { background: #f0fdf4; color: var(--secondary-dark); }
  .stat-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
  .stat-value { font-size: 1.25rem; font-weight: 800; color: var(--primary-dark); }

  .management-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; }
  .card-premium {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: var(--shadow-premium);
    border: 1px solid var(--border);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-premium:hover {
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    transform: translateY(-4px);
  }

  .prominent-radicado { font-size: 3.5rem; color: var(--primary-dark); letter-spacing: -2px; margin-top: 0.5rem; line-height: 1; }
  .badge-label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); letter-spacing: 1.5px; }
  .status-pill { padding: 0.4rem 0.8rem; border-radius: 99px; font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem; }
  .status-pill.warning { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }

  .btn-primary-premium {
    background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
    color: var(--primary-dark);
    border: none;
    padding: 1.25rem 2.5rem;
    border-radius: 18px;
    font-weight: 800;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 20px rgba(183, 212, 0, 0.3);
  }
  .btn-primary-premium:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px rgba(183, 212, 0, 0.4); }
  .btn-primary-premium:active { transform: translateY(0); }

  .empty-state { padding: 3rem; text-align: center; }
  .empty-icon { font-size: 3.5rem; color: var(--secondary); margin-bottom: 1.5rem; filter: drop-shadow(0 5px 10px rgba(183,212,0,0.2)); }
  .empty-state h3 { font-size: 1.5rem; color: var(--primary-dark); margin-bottom: 0.75rem; }
  .empty-state p { color: var(--text-muted); margin-bottom: 2rem; max-width: 300px; margin-left: auto; margin-right: auto; }

  .case-info-grid-premium { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 2rem 0; padding: 1.5rem; background: var(--bg-main); border-radius: 18px; }
  .info-tile label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
  .info-tile p { font-weight: 600; color: var(--primary-dark); }

  .input-row-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem; }
  .premium-textarea { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); background: #f8fafc; font-family: inherit; font-size: 0.9rem; transition: all 0.3s; resize: none; border-left: 4px solid var(--primary-light); }
  .premium-textarea:focus { border-color: var(--accent); background: var(--white); outline: none; transform: scale(1.01); }

  .btn-save-premium { background: linear-gradient(135deg, var(--secondary), var(--secondary-dark)); color: var(--primary-dark); border: none; padding: 1rem 2.5rem; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; transition: all 0.4s; text-transform: uppercase; letter-spacing: 1px; }
  .btn-save-premium:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 25px rgba(183, 212, 0, 0.4); }
  .btn-save-premium:active { transform: translateY(0) scale(1); }

  .ai-panel-card { background: linear-gradient(145deg, #ffffff, #f1f5f9); }
  .panel-header-premium h3 { color: var(--primary-dark); font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
  .panel-header-premium p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.5rem; }

  .ai-action-buttons { display: flex; gap: 0.75rem; margin: 1rem 0; }
  .btn-ai-outline { flex: 1; padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border); background: var(--white); color: var(--primary); font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.2s; }
  .btn-ai-outline:hover { border-color: var(--primary); background: var(--primary-dark); color: var(--white); }

  .result-box { background: var(--white); border-radius: 12px; padding: 1rem; border: 1px solid var(--border); }
  .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .box-header span { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); }
  .btn-copy-mini { background: #f1f5f9; border: none; padding: 0.3rem; border-radius: 6px; cursor: pointer; color: var(--primary); }
  .result-textarea { width: 100%; border: none; background: none; font-family: inherit; font-size: 0.85rem; color: var(--primary-dark); resize: vertical; overflow-y: auto; transition: all 0.3s; }
  .header-box { height: 50px; font-weight: 700; border-left: 3px solid var(--accent); padding-left: 0.5rem; }
  .body-box { height: 220px; line-height: 1.5; border-left: 3px solid var(--secondary); padding-left: 0.5rem; }

  /* Animations for success/update */
  @keyframes successPulse {
    0% { box-shadow: 0 0 0 0 rgba(183, 212, 0, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(183, 212, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(183, 212, 0, 0); }
  }
  .animate-success { animation: successPulse 1s ease-out; }

  .agent-section { animation: slideIn 0.5s ease-out forwards; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .status-pill.green { background: #dcfce7; color: #15803d; }
  .status-pill.red { background: #fee2e2; color: #b91c1c; }

  /* --- Admin Dashboard Premium --- */
  .admin-header-premium { background: var(--white); padding: 1.5rem 3rem; border-bottom: 1px solid var(--border); }
  .header-main-content { display: flex; justify-content: space-between; align-items: center; }
  .brand-symbol { background: var(--primary-dark); color: var(--white); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.5rem; }
  .sub-brand { color: var(--secondary-dark); font-weight: 500; font-size: 0.9rem; }
  .author { color: var(--primary); opacity: 0.8; font-weight: 700; }

  .kpi-dashboard-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.5rem; padding: 2rem 3rem; }
  .kpi-card-premium {
    padding: 1.5rem;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 1.25rem;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--white);
    box-shadow: var(--shadow);
  }
  .kpi-card-premium:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-premium);
  }
  .kpi-card-premium::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); opacity: 0; transition: opacity 0.3s; }
  .kpi-card-premium:hover::after { opacity: 1; }
  .kpi-icon-box { width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  .kpi-icon-box.blue { background: #eff6ff; color: #2563eb; }
  .kpi-icon-box.purple { background: #f5f3ff; color: #7c3aed; }
  .kpi-icon-box.lime { background: #f7fee7; color: #a2bc00; }
  .kpi-icon-box.red { background: #fef2f2; color: #dc2626; }
  .kpi-icon-box.green { background: #f0fdf4; color: #16a34a; }
  .kpi-value { font-size: 2rem; font-weight: 800; color: var(--primary-dark); }
  .kpi-subtext { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }

  .dashboard-main-columns { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; padding: 0 3rem 2rem; }
  .filter-controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; padding: 1.5rem; }
  .charts-container-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .chart-card { padding: 1.5rem; border-radius: 20px; height: 280px; }

  .ranking-content { margin-top: 1rem; }
  .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid #f1f5f9; }
  .rank-name { font-size: 0.85rem; font-weight: 600; }
  .rank-badge { background: #f0fdf4; color: #16a34a; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

  .table-full-width { margin: 0 3rem 3rem; padding: 2rem; }
  .table-responsive-premium table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
  .table-responsive-premium th { text-align: left; padding: 1rem; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--bg-main); }
  .table-responsive-premium td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; }
  .table-responsive-premium tr:hover { background: #f8fafc; }

  /* --- Loader Premium --- */
  .loader-overlay-premium {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.8); /* Slate 900 with opacity */
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    text-align: center;
  }
  .spinner-premium {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--primary-light);
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    margin-bottom: 1.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive Adjustments */
  @media (max-width: 1200px) {
    .management-grid, .dashboard-main-columns { grid-template-columns: 1fr; }
    .kpi-dashboard-row { grid-template-columns: repeat(3, 1fr); }
  }

  .portal-footer-signature { margin-top: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1rem; }
  .portal-footer-signature span { font-weight: 700; color: var(--primary); }

  #pqrsfTable, .premium-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 8px;
    margin-top: -8px;
  }
  #pqrsfTable th, .premium-table th {
    text-align: left;
    padding: 1.25rem 1rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  #pqrsfTable td, .premium-table td {
    padding: 1.25rem 1rem;
    font-size: 0.875rem;
    background: var(--white);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  #pqrsfTable td:first-child, .premium-table td:first-child { border-left: 1px solid var(--border); border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
  #pqrsfTable td:last-child, .premium-table td:last-child { border-right: 1px solid var(--border); border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }
  #pqrsfTable tr:hover td, .premium-table tr:hover td { background: var(--bg-main); border-color: var(--primary-light); }

  /* New Header Search Styles */
  .header-search-container {
    flex: 1;
    max-width: 500px;
    margin: 0 2rem;
  }

  .search-input-group-premium {
    display: flex;
    align-items: center;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.25rem 0.25rem 0.25rem 1.25rem;
    transition: all 0.3s;
    box-shadow: var(--shadow);
  }

  .search-input-group-premium:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
