<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800&display=swap');

  :root {
    --primary: #1A1231;
    --primary-light: #2A1F4D;
    --secondary: #B5E61D;
    --secondary-dark: #9AC418;
    --accent: #6366f1;
    --bg-main: #f1f5f9;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --radius-md: 14px;
    --radius-lg: 24px;
    --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    --error: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight: 800; }

  .fade-in { animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Login Redesign --- */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #241D3B;
    padding: 1.5rem;
    position: relative;
  }

  .login-container-premium {
    display: flex;
    width: 100%;
    max-width: 900px;
    min-height: 550px;
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-premium);
    z-index: 10;
  }

  .login-left-panel {
    flex: 1;
    background: linear-gradient(135deg, #241D3B, #3B2E60);
    padding: 4rem 3rem;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--white);
    overflow: hidden;
  }

  .logo-box-premium {
    background: var(--secondary);
    color: var(--primary);
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    margin-bottom: 2rem;
    box-shadow: 0 10px 20px rgba(181, 230, 29, 0.3);
  }
  .logo-box-premium i { width: 32px; height: 32px; }

  .welcome-label {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 0.5rem;
  }

  .brand-title {
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
    letter-spacing: -1px;
    color: var(--white);
  }

  .brand-description {
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.8);
    max-width: 280px;
  }

  .decoration-sphere {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3B2E60, #1A1231);
    box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5), 10px 10px 30px rgba(0,0,0,0.3);
  }
  .sphere-1 { width: 200px; height: 200px; bottom: -50px; left: -50px; }
  .sphere-2 { width: 120px; height: 120px; top: 100px; right: -40px; opacity: 0.6; }
  .sphere-3 { width: 80px; height: 80px; bottom: 150px; left: 80px; opacity: 0.4; }

  .login-right-panel {
    flex: 1;
    padding: 4rem 3.5rem;
    display: flex;
    align-items: center;
  }
  .login-form-box { width: 100%; }
  .form-title { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
  .form-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2.5rem; }
  .form-group-premium { margin-bottom: 1.5rem; }
  .premium-label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.6rem; letter-spacing: 0.5px; }

  .premium-input-wrapper { position: relative; display: flex; align-items: center; }
  .premium-input-wrapper .input-icon { position: absolute; left: 1rem; width: 18px; height: 18px; color: var(--text-muted); }

  .premium-input-wrapper input, .premium-input-wrapper select {
    width: 100%; padding: 0.9rem 1rem 0.9rem 3rem; border: 1px solid var(--border); border-radius: 12px;
    font-size: 0.95rem; background: #F8FAFC; transition: all 0.3s; outline: none; appearance: none;
  }
  .premium-input-wrapper input:focus, .premium-input-wrapper select:focus {
    background: var(--white); border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26, 18, 49, 0.05);
  }

  .btn-toggle-pass {
    position: absolute; right: 1rem; background: none; border: none; font-size: 0.7rem; font-weight: 800; color: var(--primary); cursor: pointer; letter-spacing: 1px;
  }

  .btn-auth-premium {
    width: 100%; background: var(--primary); color: var(--white); border: none; padding: 1.1rem; border-radius: 12px;
    font-weight: 700; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; transition: all 0.3s; margin-top: 2.5rem;
  }
  .btn-auth-premium:hover { background: #241D3B; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(26, 18, 49, 0.2); }

  .error-box-premium { margin-top: 1.5rem; padding: 1rem; background: #FEF2F2; color: var(--error); border-radius: 10px; font-size: 0.85rem; text-align: center; font-weight: 600; }
  .login-footer-fixed { position: absolute; bottom: 2rem; font-size: 0.7rem; font-weight: 700; color: rgba(255, 255, 255, 0.4); letter-spacing: 1px; text-align: center; width: 100%; pointer-events: none; }

  /* --- Agent Portal Layout --- */
  .agent-portal-layout {
    display: flex;
    min-height: 100vh;
    background-color: var(--bg-main);
  }

  .sidebar-nav {
    width: 280px;
    background-color: var(--primary);
    color: var(--white);
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
    position: fixed;
    height: 100vh;
    z-index: 100;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 3rem;
  }

  .brand-logo-small {
    background: var(--secondary);
    color: var(--primary);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-size: 1.2rem;
  }

  .brand-text h3 { font-size: 1rem; margin: 0; }
  .brand-text p { font-size: 0.7rem; opacity: 0.6; margin: 0; }

  .nav-menu { flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 0.5rem;
    font-weight: 600;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.7);
  }
  .nav-item i { width: 18px; height: 18px; }
  .nav-item:hover, .nav-item.active {
    background-color: rgba(255,255,255,0.1);
    color: var(--white);
  }
  .nav-item.active { background-color: var(--secondary); color: var(--primary); }

  .sidebar-footer { padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); }
  .btn-logout-minimal {
    width: 100%;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .btn-logout-minimal:hover { color: var(--error); }

  .portal-main {
    flex: 1;
    margin-left: 280px;
    padding: 2.5rem 3rem;
  }

  .portal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2.5rem;
  }

  .welcome-banner h2 { font-size: 1.75rem; color: var(--primary); margin-bottom: 0.25rem; }
  .welcome-banner p { color: var(--text-muted); font-size: 0.95rem; }

  .header-search-container { width: 400px; }
  .search-input-group-premium {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .search-icon-inside { position: absolute; left: 1rem; color: var(--text-muted); width: 18px; }
  .search-input-premium {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.85rem;
    outline: none;
  }
  .btn-search-premium {
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.7rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .quick-stats-row { display: flex; gap: 1.5rem; }
  .mini-stat-card {
    background: var(--white);
    padding: 1rem 1.5rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    border: 1px solid var(--border);
  }
  .mini-stat-card.glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
  .stat-icon {
    width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .stat-icon.purple { background: rgba(99, 102, 241, 0.1); color: var(--accent); }
  .stat-icon.lime { background: rgba(181, 230, 29, 0.1); color: var(--secondary-dark); }
  .stat-info .stat-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
  .stat-info .stat-value { font-size: 1.25rem; font-weight: 800; color: var(--primary); }

  .portal-content { display: block; }
  .agent-section { display: none; }
  .agent-section.active { display: block; }
  #agent-section-gestion.active { display: grid !important; }

  .management-grid {
    display: grid;
    grid-template-columns: 1.8fr 1fr;
    gap: 2rem;
  }

  .card-premium {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    border: 1px solid var(--border);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.03);
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
  }
  .empty-icon {
    width: 80px; height: 80px; background: var(--bg-main); color: var(--text-muted); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
  }
  .empty-icon i { width: 36px; height: 36px; }
  .empty-state h3 { font-size: 1.25rem; color: var(--primary); margin-bottom: 0.75rem; }
  .empty-state p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

  .btn-primary-premium {
    background: var(--primary); color: var(--white); border: none; padding: 1rem 2rem; border-radius: 12px;
    font-weight: 700; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.75rem; transition: all 0.3s;
  }
  .btn-primary-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(26,18,49,0.15); }

  .case-header-premium {
    display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
  }
  .badge-label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .prominent-radicado { font-size: 2.2rem; color: var(--primary); line-height: 1.1; }
  .status-pill { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem; }
  .status-pill.warning { background: #FFF8E1; color: #F9A825; }
  .status-pill.green { background: #E8F5E9; color: #2E7D32; }
  .status-pill.red { background: #FFEBEE; color: #C62828; }

  .btn-liberar-radicado {
    background: none; border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); cursor: pointer; margin-top: 0.5rem; display: flex; align-items: center; gap: 0.4rem;
  }
  .btn-liberar-radicado:hover { color: var(--error); border-color: var(--error); }

  .case-info-grid-premium {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2.5rem; background: #F8FAFC; padding: 1.5rem; border-radius: 16px;
  }
  .info-tile label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem; }
  .info-tile p { font-size: 0.85rem; font-weight: 700; color: var(--primary); }

  .input-row-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
  .premium-select, .premium-textarea, .premium-input {
    width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 10px; font-size: 0.85rem; background: #F8FAFC; outline: none; transition: border-color 0.2s;
  }
  .premium-select:focus, .premium-textarea:focus { border-color: var(--primary); }

  .form-premium { display: block; }
  .form-footer-actions { margin-top: 2rem; }

  .btn-save-premium {
    background: var(--secondary); color: var(--primary); border: none; padding: 1rem 2rem; border-radius: 12px; font-weight: 800; font-size: 0.9rem; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; box-shadow: 0 4px 12px rgba(181, 230, 29, 0.2);
  }

  .panel-header-premium { margin-bottom: 1.5rem; }
  .panel-header-premium h3 { font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 0.6rem; }
  .panel-header-premium p { font-size: 0.85rem; color: var(--text-muted); }

  .ai-action-buttons { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
  .btn-ai-outline {
    flex: 1; background: none; border: 1px solid var(--primary); color: var(--primary); padding: 0.75rem; border-radius: 10px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn-ai-outline:hover { background: var(--primary); color: var(--white); }

  .result-box { background: #F8FAFC; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
  .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .box-header span { font-size: 0.6rem; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; }
  .result-textarea { width: 100%; background: none; border: none; font-size: 0.85rem; font-family: inherit; color: var(--primary); resize: none; outline: none; }
  .header-box { font-weight: 700; height: 40px; }
  .body-box { height: 120px; line-height: 1.5; }

  .btn-copy-mini { background: none; border: none; color: var(--text-muted); cursor: pointer; }
  .btn-copy-mini:hover { color: var(--primary); }

  .premium-table { width: 100%; border-collapse: separate; border-spacing: 0 0.75rem; }
  .premium-table th { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; padding: 0 1rem; border: none; }
  .premium-table td { padding: 1.25rem 1rem; background: var(--white); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; }
  .premium-table tr td:first-child { border-left: 1px solid var(--border); border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
  .premium-table tr td:last-child { border-right: 1px solid var(--border); border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

  .table-responsive-premium { overflow-x: auto; }
  .portal-footer-signature { margin-top: 2rem; text-align: center; }

  .badge-mini { background: var(--error); color: var(--white); font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 10px; margin-left: auto; }

  /* --- Administrative Specifics --- */

  /* SaaS Premium Modal Refinements */
  .premium-modal-header-info {
    margin-bottom: 2.5rem;
    display: flex;
    padding: 0 4rem;
  }

  .info-pill {
    background: #0F172A;
    color: #FFFFFF;
    padding: 0.8rem 2rem;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 15px 30px -5px rgba(15, 23, 42, 0.3);
  }

  .pill-label { opacity: 0.5; font-size: 0.75rem; text-transform: uppercase; }
  .pill-value { color: #B5E61D; font-family: 'Montserrat', sans-serif; }

  .case-info-card-premium {
    background: #F8FAFC;
    border: 2px solid #F1F5F9;
    border-radius: 32px;
    padding: 3rem;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 3.5rem;
    margin-bottom: 3.5rem;
  }

  .info-item label {
    display: block;
    font-size: 0.8rem;
    font-weight: 800;
    color: #64748B;
    text-transform: uppercase;
    margin-bottom: 1rem;
    letter-spacing: 1px;
  }

  .info-item p {
    font-size: 1.3rem;
    font-weight: 800;
    color: #1E293B;
    margin: 0;
    line-height: 1.3;
  }

  .form-grid-premium {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    margin-bottom: 3rem;
  }

  .premium-label-small {
    display: block;
    font-size: 0.9rem;
    font-weight: 800;
    color: #334155;
    margin-bottom: 1.25rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .premium-select-wrapper {
    position: relative;
    width: 100%;
  }

  .premium-select-custom {
    width: 100%;
    padding: 1rem 1.25rem;
    border: 2px solid #F1F5F9;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 600;
    background: #F8FAFC;
    color: var(--primary);
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    appearance: none;
    cursor: pointer;
  }

  .premium-select-custom:focus {
    border-color: var(--primary);
    background: #FFFFFF;
    box-shadow: 0 10px 25px -5px rgba(26, 18, 49, 0.1);
    transform: translateY(-2px);
  }

  .premium-textarea-custom {
    width: 100%;
    padding: 1.5rem;
    border: 2px solid #F1F5F9;
    border-radius: 24px;
    font-size: 1rem;
    font-weight: 500;
    background: #F8FAFC;
    color: var(--primary);
    outline: none;
    transition: all 0.3s ease;
    resize: none;
    line-height: 1.6;
  }

  .premium-textarea-custom:focus {
    border-color: var(--primary);
    background: #FFFFFF;
    box-shadow: 0 10px 25px -5px rgba(26, 18, 49, 0.1);
    transform: translateY(-2px);
  }

  .modal-footer-premium {
    margin-top: 4.5rem;
  }

  .btn-update-premium {
    width: 100%;
    background: #1A1231;
    color: #B5E61D;
    border: none;
    padding: 1.75rem;
    border-radius: 28px;
    font-weight: 800;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 25px 50px -10px rgba(26, 18, 49, 0.4);
    letter-spacing: 1px;
  }

  .btn-update-premium:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 35px 70px -15px rgba(26, 18, 49, 0.5);
    background: #241D3B;
  }

  .btn-update-premium i {
    width: 18px;
    height: 18px;
  }

  /* Loader */
  .loader-overlay-premium {
    position: fixed; inset: 0; background: rgba(26, 18, 49, 0.9); backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--white);
  }
  .spinner-premium {
    width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: var(--secondary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Premium Modal & Overlay --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    animation: fadeInOverlay 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }

  .modal-content {
    background: #FFFFFF;
    border-radius: 40px;
    width: 95%;
    max-width: 850px;
    padding: 0;
    box-shadow: 0 40px 100px -12px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    animation: modalScaleUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalScaleUp {
    from { transform: scale(0.9) translateY(30px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3.5rem 4rem 1.5rem;
    background: #FFFFFF;
    position: relative;
    z-index: 11;
  }

  .modal-header h3 {
    font-size: 1.8rem;
    color: #0F172A;
    margin: 0;
