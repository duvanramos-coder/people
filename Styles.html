<style>
  :root {
    --primary: #3b3561;
    --primary-light: #4e467d;
    --secondary: #b7d400;
    --accent: #6366f1;
    --success: #22c55e;
    --warning: #facc15;
    --danger: #ef4444;
    --background: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--background);
    color: var(--text-main);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* Loader */
  .loader-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  .loader-content {
    text-align: center;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 5px solid var(--border);
    border-bottom-color: var(--secondary);
    border-radius: 50%;
    display: inline-block;
    animation: rotation 1s linear infinite;
    margin-bottom: 1rem;
  }

  @keyframes rotation {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Layout */
  .app-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* Header */
  .main-header {
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .logo-icon {
    background: var(--primary);
    color: white;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.5rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
  }

  .subtitle {
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .header-actions {
    display: flex;
    gap: 0.75rem;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-weight: 500;
    font-size: 0.875rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
  }

  .btn-primary {
    background-color: var(--secondary);
    color: var(--primary);
  }

  .btn-primary:hover {
    filter: brightness(0.95);
    transform: translateY(-1px);
  }

  .btn-outline {
    background-color: white;
    border-color: var(--border);
    color: var(--text-main);
  }

  .btn-outline:hover {
    background-color: var(--background);
    border-color: var(--text-muted);
  }

  .btn-icon {
    padding: 0.5rem;
    border-radius: 6px;
    background: var(--primary);
    color: white;
  }

  /* Cards */
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 1.25rem;
    border: 1px solid var(--border);
  }

  .card-header {
    margin-bottom: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-header h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Controls Row */
  .controls-row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  /* Search */
  .search-input-group {
    display: flex;
    gap: 0.5rem;
  }

  input[type="text"], input[type="date"], select {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--accent);
  }

  .search-result-container {
    margin-top: 1rem;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 0.75rem;
  }

  .search-card-premium {
    width: 100%;
    background: linear-gradient(135deg, #fefefe 0%, #f9f9f9 100%);
    border-left: 4px solid var(--secondary);
    padding: 1rem;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .search-card-premium h4 {
    margin-bottom: 0.5rem;
    color: var(--primary);
  }

  .search-card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    font-size: 0.75rem;
    gap: 0.5rem;
  }

  .search-card-grid div span {
    font-weight: 600;
    color: var(--text-muted);
  }

  /* Filters */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: var(--text-muted);
  }

  /* KPIs */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .kpi-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s;
  }

  .kpi-card:hover {
    transform: translateY(-4px);
  }

  .kpi-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .kpi-label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-muted);
  }

  .kpi-value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 0.25rem;
  }

  .kpi-trend {
    font-size: 0.75rem;
    font-weight: 500;
  }

  .text-blue { color: var(--accent); }
  .text-green { color: var(--success); }
  .text-red { color: var(--danger); }
  .text-lime { color: #84cc16; }

  /* Insights */
  .insights-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .insight-content {
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 100%;
  }

  .insight-item {
    text-align: center;
  }

  .insight-item .label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .pagination-controls {
    display: flex;
    gap: 0.5rem;
  }

  .pagination-controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .insight-item .value {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
  }

  .dynamic-insight {
    display: flex;
    align-items: center;
    padding: 1.25rem;
    background-color: var(--primary);
    color: white;
    font-weight: 500;
  }

  /* Charts */
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .canvas-wrapper {
    height: 200px;
    width: 100%;
    position: relative;
  }

  .trend-section {
    margin-bottom: 2rem;
  }

  .trend-wrapper {
    height: 300px;
  }

  /* Table */
  .table-section {
    padding: 0;
    overflow: hidden;
  }

  .table-header {
    padding: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .table-actions {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  #tableSearch {
    width: 250px;
  }

  .table-responsive {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.875rem;
  }

  th {
    background: #f1f5f9;
    padding: 0.75rem 1rem;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
  }

  th:hover {
    background: #e2e8f0;
  }

  td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover td {
    background-color: #f8fafc;
  }

  .badge {
    padding: 0.25rem 0.5rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge-success { background: #dcfce7; color: #166534; }
  .badge-danger { background: #fee2e2; color: #991b1b; }
  .badge-warning { background: #fef9c3; color: #854d0e; }

  .table-pagination {
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Footer */
  .main-footer {
    padding: 2rem 0;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  /* Responsive */
  @media (max-width: 1200px) {
    .charts-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 900px) {
    .controls-row, .kpi-grid, .insights-row {
      grid-template-columns: 1fr;
    }
    .app-container {
      padding: 0 1rem;
    }
  }

  @media print {
    .loader-overlay, .header-actions, .controls-row, .main-footer, .table-pagination, .table-actions {
      display: none !important;
    }
    body {
      background: white;
    }
    .app-container {
      max-width: 100%;
      padding: 0;
    }
    .card {
      box-shadow: none;
      border: 1px solid #eee;
      page-break-inside: avoid;
    }
    .charts-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .trend-wrapper {
      height: 250px;
    }
  }
</style>
