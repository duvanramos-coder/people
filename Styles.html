<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    /* Light Mode (Default) */
    --bg-main: #F4F7FE;
    --bg-sidebar: #1D1F49;
    --bg-card: #FFFFFF;
    --text-main: #1B2559;
    --text-muted: #A3AED0;
    --border-color: #E9EDF7;
    --primary: #342D50;
    --primary-light: #4A446E;
    --secondary: #B7D400;
    --secondary-dark: #9AC418;
    --accent: #4318FF;
    --error: #EE5D50;
    --success: #05CD99;
    --warning: #FFB800;

    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-premium: 0px 20px 40px rgba(112, 144, 176, 0.06);
    --glow-secondary: 0 0 20px rgba(183, 212, 0, 0.2);

    /* Constants */
    --white: #ffffff;
    --sidebar-width: 280px;
    --sidebar-collapsed-width: 80px;
  }

  [data-theme="dark"] {
    --bg-main: #131537;
    --bg-sidebar: #1D1F49; /* Sidebar stays dark */
    --bg-card: rgba(40, 43, 90, 0.4);
    --text-main: #FFFFFF;
    --text-muted: #8E94BB;
    --border-color: rgba(255, 255, 255, 0.05);
    --primary: #1D1F49;
    --primary-light: #282B5A;
    --secondary: #C4E538;
    --secondary-dark: #A8C628;
    --accent: #6366f1;
    --error: #ef4444;
    --success: #C4E538;
    --warning: #facc15;
    --shadow-premium: 0px 20px 50px rgba(0, 0, 0, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background-color 0.3s, color 0.3s;
  }

  h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: var(--text-main); }

  .fade-in { animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Logo Styling --- */
  .logo-container-login {
    width: 100px;
    height: 100px;
    margin-bottom: 2rem;
    position: relative;
    z-index: 5;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
  }

  .logo-container-sidebar {
    width: 45px;
    height: 45px;
  }

  function getStatusClass(status) {
    const s = (status || "").toLowerCase();
    if (s.includes('contactado')) return 'green';
    if (s.includes('no contesta') || s.includes('corte') || s.includes('corta')) return 'red';
    return 'warning';
  }

  /* --- Glassmorphism --- */
  .glass-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-premium);
    transition: background-color 0.3s, border-color 0.3s;
  }

  /* --- Login --- */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg-sidebar);
    padding: 1.5rem;
    position: relative;
  }

  .login-container-premium {
    display: flex;
    width: 100%;
    max-width: 950px;
    min-height: 580px;
    background: var(--bg-sidebar);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-premium);
    border: 1px solid rgba(255,255,255,0.05);
    z-index: 10;
  }

  .login-left-panel {
    flex: 1;
    background: linear-gradient(135deg, #1D1F49, #282B5A);
    padding: 4rem 3.5rem;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--white);
    overflow: hidden;
  }

  .welcome-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 3px; color: var(--secondary); margin-bottom: 0.5rem; }
  .brand-title { font-size: 2.8rem; margin-bottom: 1.5rem; letter-spacing: -1.5px; color: var(--white); line-height: 1; }
  .brand-description { font-size: 1rem; line-height: 1.7; color: rgba(255,255,255,0.6); max-width: 320px; }
  .by-author-login { font-size: 0.85rem; font-weight: 700; color: var(--secondary); margin-top: 1rem; letter-spacing: 1px; opacity: 0.8; }

  .decoration-sphere { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #282B5A, #131537); box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5); }
  .sphere-1 { width: 220px; height: 220px; bottom: -60px; left: -60px; }
  .sphere-2 { width: 140px; height: 140px; top: 80px; right: -50px; opacity: 0.6; }

  .login-right-panel { flex: 1; padding: 4rem 4rem; display: flex; align-items: center; background: var(--bg-main); transition: background-color 0.3s; }
  .login-form-box { width: 100%; }
  .form-title { font-size: 2.2rem; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.5px; }
  .form-subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2.5rem; }
  .form-group-premium { margin-bottom: 1.8rem; }
  .premium-label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; letter-spacing: 1.2px; text-transform: uppercase; }

  .premium-input-wrapper { position: relative; display: flex; align-items: center; }
  .premium-input-wrapper .input-icon { position: absolute; left: 1.2rem; width: 18px; height: 18px; color: var(--text-muted); }
  .premium-input-wrapper input, .premium-input-wrapper select { width: 100%; padding: 1rem 1rem 1rem 3.5rem; border: 1px solid var(--border-color); border-radius: 12px; font-size: 1rem; background: var(--bg-card); color: var(--text-main); transition: all 0.3s; outline: none; appearance: none; }
  .premium-input-wrapper input:focus, .premium-input-wrapper select:focus { border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(183, 212, 0, 0.1); }

  .btn-toggle-pass { position: absolute; right: 1.2rem; background: none; border: none; font-size: 0.7rem; font-weight: 800; color: var(--secondary-dark); cursor: pointer; letter-spacing: 1px; }
  .btn-auth-premium { width: 100%; background: var(--secondary); color: #1D1F49; border: none; padding: 1.2rem; border-radius: 12px; font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; transition: all 0.3s; margin-top: 2.5rem; box-shadow: var(--glow-secondary); }
  .btn-auth-premium:hover { background: var(--secondary-dark); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(183, 212, 0, 0.3); }
  .login-footer-fixed { position: absolute; bottom: 2rem; font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.3); letter-spacing: 2px; text-align: center; width: 100%; pointer-events: none; }

  /* --- Sidebar --- */
  .sidebar-nav { width: var(--sidebar-width); background-color: var(--bg-sidebar); color: var(--white); display: flex; flex-direction: column; padding: 2.5rem 1.5rem; position: fixed; height: 100vh; border-right: 1px solid rgba(255,255,255,0.05); z-index: 100; }
  .sidebar-brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 3.5rem; }
  .brand-text h3 { font-size: 1.1rem; margin: 0; letter-spacing: -0.5px; color: var(--white); }
  .brand-text p { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin: 0; font-weight: 600; }
  .nav-menu { flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 1.2rem; padding: 1.1rem 1.5rem; border-radius: 12px; cursor: pointer; transition: all 0.3s; margin-bottom: 0.6rem; font-weight: 600; font-size: 0.95rem; color: rgba(255,255,255,0.5); }
  .nav-item i { width: 20px; height: 20px; }
  .nav-item:hover { background-color: rgba(255,255,255,0.03); color: var(--white); }
  .nav-item.active { background-color: rgba(255, 255, 255, 0.08); color: var(--secondary); position: relative; }
  .nav-item.active::after { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 20px; background: var(--secondary); border-radius: 0 4px 4px 0; }
  .sidebar-footer { padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); }
  .btn-logout-minimal { width: 100%; background: none; border: none; color: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 1rem; padding: 0.8rem; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s; }
  .btn-logout-minimal:hover { color: var(--error); }

  /* --- Layouts --- */
  .agent-portal-layout { display: flex; min-height: 100vh; background-color: var(--bg-main); }
  .portal-main { flex: 1; margin-left: var(--sidebar-width); padding: 2.5rem 3.5rem; }
  .admin-dashboard-view { padding: 2.5rem 4rem; background-color: var(--bg-main); min-height: 100vh; transition: background-color 0.3s; }

  .portal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3.5rem; }
  .welcome-banner h1, .welcome-banner h2 { font-size: 2rem; margin-bottom: 0.2rem; letter-spacing: -1px; color: var(--text-main); }
  .welcome-banner p { color: var(--text-muted); font-size: 0.95rem; }

  .db-filters { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .filter-select { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.6rem 1rem; font-size: 0.8rem; color: var(--text-main); font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.03); }
  .filter-select:hover { border-color: var(--accent); }

  .btn-icon-header { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); transition: all 0.2s; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.03); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn-icon-header:hover { background: var(--accent); color: var(--white); transform: translateY(-2px); }

  /* --- KPI Cards --- */
  .kpi-card { background: var(--bg-card); border-radius: 20px; padding: 1.5rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-premium); transition: all 0.3s; display: flex; align-items: center; gap: 1.2rem; }
  .kpi-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .kpi-icon-wrapper { width: 56px; height: 56px; border-radius: 50%; background: var(--bg-main); color: var(--accent); display: flex; align-items: center; justify-content: center; transition: background-color 0.3s; }
  .kpi-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-value { font-size: 1.8rem; font-weight: 800; margin: 0; color: var(--text-main); line-height: 1.2; }
  .kpi-trend { font-size: 0.7rem; font-weight: 700; margin-top: 4px; }
  .trend-up { color: var(--success); }
  .trend-down { color: var(--error); }

  /* --- Charts --- */
  .chart-container { height: 220px; position: relative; }
  .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; color: var(--text-main); }
  .card-title i { color: var(--accent); width: 20px; }

  /* --- Table --- */
  .table-container { overflow-x: auto; }
  .premium-table { width: 100%; border-collapse: separate; border-spacing: 0 0.8rem; }
  .premium-table th { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; padding: 0 1.5rem; border: none; letter-spacing: 1px; cursor: pointer; }
  .premium-table td { padding: 1.1rem 1.2rem; background: var(--bg-card); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); font-size: 0.85rem; font-weight: 600; color: var(--text-main); transition: background-color 0.3s; }
  .premium-table tr { transition: all 0.3s; }
