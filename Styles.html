<style>
:root {
    --bg-dark: #0f172a;
    --bg-card: rgba(30, 41, 59, 0.7);
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
    --glass: rgba(255, 255, 255, 0.03);
    --success: #22c55e;
    --error: #ef4444;
    --warning: #f59e0b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.5;
    overflow-x: hidden;
}

h1, h2, h3 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
}

/* Scrollbar Customization */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* Loader */
.loader-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-dark); display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 9999;
}
.spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Login */
.login-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top right, #1e293b, #0f172a);
}
.login-card {
    background: var(--bg-card); backdrop-filter: blur(12px);
    padding: 3rem; border-radius: 1.5rem; border: 1px solid var(--border);
    width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    animation: fadeIn 0.6s ease-out;
}
.login-card h1 { font-size: 1.875rem; margin-bottom: 0.5rem; text-align: center; }
.login-card p { color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.875rem; }

.form-group { margin-bottom: 1.5rem; }
.form-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
.form-group input {
    width: 100%; background: var(--glass); border: 1px solid var(--border);
    border-radius: 0.75rem; padding: 0.75rem 1rem; color: white; outline: none;
    transition: all 0.2s;
}
.form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

.btn-primary {
    width: 100%; background: var(--accent); color: var(--bg-dark); border: none;
    padding: 0.75rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

/* Dashboard Layout */
.dashboard-layout { display: flex; min-height: 100vh; }
.sidebar {
    width: 260px; background: rgba(15, 23, 42, 0.8); border-right: 1px solid var(--border);
    padding: 2rem 1.5rem; display: flex; flex-direction: column;
}
.main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }

.nav-item {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
    color: var(--text-muted); text-decoration: none; border-radius: 0.5rem;
    margin-bottom: 0.5rem; transition: all 0.2s; cursor: pointer;
}
.nav-item:hover, .nav-item.active { background: var(--glass); color: white; }

/* Grid & Cards */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
.stat-card {
    background: var(--bg-card); border: 1px solid var(--border); padding: 1.5rem;
    border-radius: 1rem; transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-4px); }
.stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; }
.stat-value { font-size: 1.5rem; font-weight: 700; }

.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.card-title { font-size: 1.125rem; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); padding-bottom: 1rem; }
td { padding: 0.75rem 0; border-top: 1px solid var(--border); font-size: 0.875rem; }

/* Badge */
.badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
.badge-success { background: rgba(34, 197, 94, 0.1); color: var(--success); }
.badge-error { background: rgba(239, 68, 68, 0.1); color: var(--error); }
.badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.fade-in { animation: fadeIn 0.4s ease-out forwards; }

/* Search Results */
.search-box { margin-bottom: 2rem; position: relative; }
.search-box input {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 1rem; padding: 1rem 3rem; color: white; outline: none; font-size: 1rem;
}
.search-icon { position: absolute; left: 1.25rem; top: 1.15rem; color: var(--text-muted); }

.search-results-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-content {
    background: var(--bg-dark); border: 1px solid var(--border); padding: 2.5rem;
    border-radius: 1.5rem; width: 100%; max-width: 500px;
}

/* Turnos List */
.turnos-list { display: flex; flex-direction: column; gap: 1rem; }
.turno-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
.turno-name { font-weight: 500; }
.turno-status { font-size: 0.75rem; }

@media (max-width: 1024px) {
    .grid-2 { grid-template-columns: 1fr; }
    .sidebar { display: none; }
}
</style>
