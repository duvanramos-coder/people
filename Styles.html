<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap');

  :root {
    /* Strict Premium Palette */
    --primary: #1D1F49;            /* Deep Navy Background */
    --primary-light: #282B5A;      /* Surface/Card Base */
    --primary-dark: #131537;       /* Main App Background */
    --secondary: #C4E538;          /* Lime Yellow Accent */
    --secondary-dark: #A8C628;

    --accent: #6366f1;
    --white: #ffffff;
    --text-main: #FFFFFF;
    --text-muted: #8E94BB;         /* Bluish Grey */
    --border-subtle: rgba(255, 255, 255, 0.05);

    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-premium: 0px 20px 50px rgba(0, 0, 0, 0.4);
    --glow-secondary: 0 0 20px rgba(196, 229, 56, 0.3);
    --error: #ef4444;
    --success: #C4E538;
    --warning: #facc15;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--primary-dark);
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: var(--text-main); }

  .fade-in { animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Premium Glassmorphism --- */
  .glass-card {
    background: rgba(40, 43, 90, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-premium);
  }

  /* --- Login Redesign --- */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--primary-dark);
    padding: 1.5rem;
    position: relative;
  }

  .login-container-premium {
    display: flex;
    width: 100%;
    max-width: 950px;
    min-height: 580px;
    background: var(--primary);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-premium);
    border: 1px solid var(--border-subtle);
    z-index: 10;
  }

  .login-left-panel {
    flex: 1;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    padding: 4rem 3.5rem;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--white);
    overflow: hidden;
  }

  .logo-box-premium {
    background: var(--secondary);
    color: var(--primary);
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    margin-bottom: 2rem;
    box-shadow: var(--glow-secondary);
  }
  .logo-box-premium i { width: 30px; height: 30px; }

  .welcome-label {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--secondary);
    margin-bottom: 0.5rem;
  }

  .brand-title {
    font-size: 2.8rem;
    margin-bottom: 1.5rem;
    letter-spacing: -1.5px;
    color: var(--white);
    line-height: 1;
  }

  .brand-description {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text-muted);
    max-width: 320px;
  }

  .decoration-sphere {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--primary-light), var(--primary-dark));
    box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5);
  }
  .sphere-1 { width: 220px; height: 220px; bottom: -60px; left: -60px; }
  .sphere-2 { width: 140px; height: 140px; top: 80px; right: -50px; opacity: 0.6; }

  .login-right-panel {
    flex: 1;
    padding: 4rem 4rem;
    display: flex;
    align-items: center;
    background: var(--primary-dark);
  }
  .login-form-box { width: 100%; }
  .form-title { font-size: 2.2rem; color: var(--white); margin-bottom: 0.5rem; letter-spacing: -0.5px; }
  .form-subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2.5rem; }
  .form-group-premium { margin-bottom: 1.8rem; }
  .premium-label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; letter-spacing: 1.2px; text-transform: uppercase; }

  .premium-input-wrapper { position: relative; display: flex; align-items: center; }
  .premium-input-wrapper .input-icon { position: absolute; left: 1.2rem; width: 18px; height: 18px; color: var(--text-muted); }

  .premium-input-wrapper input, .premium-input-wrapper select {
    width: 100%; padding: 1rem 1rem 1rem 3.5rem; border: 1px solid var(--border-subtle); border-radius: 12px;
    font-size: 1rem; background: var(--primary-light); color: var(--white); transition: all 0.3s; outline: none; appearance: none;
  }
  .premium-input-wrapper input:focus, .premium-input-wrapper select:focus {
    border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(196, 229, 56, 0.1);
  }

  .btn-toggle-pass {
    position: absolute; right: 1.2rem; background: none; border: none; font-size: 0.7rem; font-weight: 800; color: var(--secondary); cursor: pointer; letter-spacing: 1px;
  }

  .btn-auth-premium {
    width: 100%; background: var(--secondary); color: var(--primary); border: none; padding: 1.2rem; border-radius: 12px;
    font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; transition: all 0.3s; margin-top: 2.5rem;
    box-shadow: var(--glow-secondary);
  }
  .btn-auth-premium:hover { background: var(--secondary-dark); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(196, 229, 56, 0.4); }

  .error-box-premium { margin-top: 1.5rem; padding: 1rem; background: rgba(239, 68, 68, 0.1); color: var(--error); border-radius: 10px; font-size: 0.85rem; text-align: center; font-weight: 600; border: 1px solid rgba(239, 68, 68, 0.2); }
  .login-footer-fixed { position: absolute; bottom: 2rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); letter-spacing: 2px; text-align: center; width: 100%; pointer-events: none; opacity: 0.5; }

  /* --- Agent Portal Layout --- */
  .agent-portal-layout {
    display: flex;
    min-height: 100vh;
    background-color: var(--primary-dark);
  }

  .sidebar-nav {
    width: 280px;
    background-color: var(--primary);
    color: var(--white);
    display: flex;
    flex-direction: column;
    padding: 2.5rem 1.5rem;
    position: fixed;
    height: 100vh;
    border-right: 1px solid var(--border-subtle);
    z-index: 100;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 3.5rem;
  }

  .brand-logo-small {
    background: var(--secondary);
    color: var(--primary);
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-weight: 800;
    font-size: 1.3rem;
    box-shadow: var(--glow-secondary);
  }

  .brand-text h3 { font-size: 1.1rem; margin: 0; letter-spacing: -0.5px; }
  .brand-text p { font-size: 0.75rem; color: var(--text-muted); margin: 0; font-weight: 600; }

  .nav-menu { flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 1.1rem 1.5rem;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 0.6rem;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-muted);
  }
  .nav-item i { width: 20px; height: 20px; }
  .nav-item:hover {
    background-color: rgba(255,255,255,0.03);
    color: var(--white);
  }
  .nav-item.active {
    background-color: rgba(196, 229, 56, 0.08);
    color: var(--secondary);
    position: relative;
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 20px;
    background: var(--secondary);
    border-radius: 0 4px 4px 0;
  }

  .sidebar-footer { padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); }
  .btn-logout-minimal {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.8rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.3s;
  }
  .btn-logout-minimal:hover { color: var(--error); }

  .portal-main {
    flex: 1;
    margin-left: 280px;
    padding: 3rem 4rem;
  }

  .portal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3.5rem;
  }

  .welcome-banner h2 { font-size: 2.2rem; margin-bottom: 0.4rem; letter-spacing: -1px; }
  .welcome-banner p { color: var(--text-muted); font-size: 1.05rem; }

  .header-search-container { width: 420px; }
  .search-input-group-premium {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .search-icon-inside { position: absolute; left: 1.2rem; color: var(--text-muted); width: 18px; }
  .search-input-premium {
    width: 100%;
    padding: 1rem 1rem 1rem 3.2rem;
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    font-size: 0.95rem;
    background: var(--primary);
    color: var(--white);
    outline: none;
    transition: all 0.3s;
  }
  .search-input-premium:focus { border-color: var(--secondary); background: var(--primary-light); }

  .btn-search-premium {
    background: var(--secondary);
    color: var(--primary);
    border: none;
    padding: 0.9rem 1.5rem;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--glow-secondary);
  }

  .quick-stats-row { display: flex; gap: 1.5rem; }
  .mini-stat-card {
    background: var(--primary);
    padding: 1.2rem 1.8rem;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-premium);
  }
  .stat-icon {
    width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  }
  .stat-icon.purple { background: rgba(99, 102, 241, 0.1); color: var(--accent); }
  .stat-icon.lime { background: rgba(196, 229, 56, 0.1); color: var(--secondary); }
  .stat-info .stat-label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat-info .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--white); }

  .portal-content { display: block; }
  .agent-section { display: none; }
  .agent-section.active { display: block; }
  #agent-section-gestion.active { display: grid !important; }

  .management-grid {
    display: grid;
    grid-template-columns: 1.8fr 1fr;
    gap: 2.5rem;
  }

  .card-premium {
    background: var(--primary);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-premium);
  }

  .empty-state {
    text-align: center;
    padding: 5rem 2rem;
  }
  .empty-icon {
    width: 90px; height: 90px; background: var(--primary-light); color: var(--secondary); border-radius: 24px;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;
    box-shadow: var(--glow-secondary);
  }
  .empty-icon i { width: 40px; height: 40px; }
  .empty-state h3 { font-size: 1.5rem; margin-bottom: 0.8rem; letter-spacing: -0.5px; }
  .empty-state p { color: var(--text-muted); font-size: 1rem; margin-bottom: 2.5rem; max-width: 400px; margin-left: auto; margin-right: auto; }

  .btn-primary-premium {
    background: var(--secondary); color: var(--primary); border: none; padding: 1.2rem 2.5rem; border-radius: 14px;
    font-weight: 800; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 1rem; transition: all 0.3s;
    box-shadow: var(--glow-secondary);
  }
  .btn-primary-premium:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(196, 229, 56, 0.4); }

  .case-header-premium {
    display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; padding-bottom: 1.8rem; border-bottom: 1px solid var(--border-subtle);
  }
  .badge-label { font-size: 0.7rem; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 2px; }
  .prominent-radicado { font-size: 2.8rem; color: var(--white); line-height: 1; letter-spacing: -1.5px; }
  .status-pill { padding: 0.5rem 1rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.6rem; border: 1px solid transparent; }
  .status-pill.warning { background: rgba(249, 168, 37, 0.1); color: #F9A825; border-color: rgba(249, 168, 37, 0.2); }
  .status-pill.green { background: rgba(196, 229, 56, 0.1); color: var(--secondary); border-color: rgba(196, 229, 56, 0.2); }
  .status-pill.red { background: rgba(239, 68, 68, 0.1); color: var(--error); border-color: rgba(239, 68, 68, 0.2); }

  .btn-liberar-radicado {
    background: none; border: 1px solid var(--border-subtle); padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); cursor: pointer; margin-top: 0.8rem; display: flex; align-items: center; gap: 0.5rem; transition: all 0.3s;
  }
  .btn-liberar-radicado:hover { color: var(--error); border-color: var(--error); background: rgba(239,68,68,0.05); }

  .case-info-grid-premium {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 3rem; background: var(--primary-light); padding: 2rem; border-radius: 20px; border: 1px solid var(--border-subtle);
  }
  .info-tile label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.6rem; letter-spacing: 1px; }
  .info-tile p { font-size: 0.95rem; font-weight: 700; color: var(--white); }

  .input-row-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
  .premium-select, .premium-textarea, .premium-input {
    width: 100%; padding: 1rem 1.2rem; border: 1px solid var(--border-subtle); border-radius: 12px; font-size: 0.95rem; background: var(--primary-dark); color: var(--white); outline: none; transition: all 0.3s;
  }
  .premium-select:focus, .premium-textarea:focus, .premium-input:focus { border-color: var(--secondary); background: var(--primary-light); }

  .form-footer-actions { margin-top: 2.5rem; }

  .btn-save-premium {
    background: var(--secondary); color: var(--primary); border: none; padding: 1.2rem; border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.8rem; box-shadow: var(--glow-secondary); transition: all 0.3s;
  }
  .btn-save-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(196, 229, 56, 0.4); background: var(--secondary-dark); }

  .panel-header-premium { margin-bottom: 2rem; }
  .panel-header-premium h3 { font-size: 1.3rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.8rem; }
  .panel-header-premium p { font-size: 0.95rem; color: var(--text-muted); }

  .ai-action-buttons { display: flex; gap: 1rem; margin-bottom: 2rem; }
  .btn-ai-outline {
    flex: 1; background: none; border: 1px solid var(--secondary); color: var(--secondary); padding: 1rem; border-radius: 12px; font-weight: 800; font-size: 0.75rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
  }
  .btn-ai-outline:hover { background: var(--secondary); color: var(--primary); box-shadow: var(--glow-secondary); }

  .result-box { background: var(--primary-dark); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.2rem; transition: all 0.3s; }
  .result-box:hover { border-color: var(--secondary); }
  .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .box-header span { font-size: 0.65rem; font-weight: 800; color: var(--secondary); letter-spacing: 1.5px; text-transform: uppercase; }
  .result-textarea { width: 100%; background: none; border: none; font-size: 0.95rem; font-family: 'Inter', sans-serif; color: var(--white); resize: none; outline: none; line-height: 1.6; }
  .header-box { font-weight: 700; height: 50px; }
  .body-box { height: 160px; }

  .btn-copy-mini { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: all 0.3s; }
  .btn-copy-mini:hover { color: var(--secondary); transform: scale(1.1); }

  /* --- Premium Table --- */
  .premium-table { width: 100%; border-collapse: separate; border-spacing: 0 0.8rem; }
  .premium-table th { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; padding: 0 1.5rem; border: none; letter-spacing: 1px; }
  .premium-table td { padding: 1.5rem; background: var(--primary); border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); font-size: 0.9rem; font-weight: 600; color: var(--white); }
  .premium-table tr { transition: all 0.3s; }
  .premium-table tr:hover td { background: var(--primary-light); transform: translateY(-2px); border-color: var(--secondary); }
  .premium-table tr td:first-child { border-left: 1px solid var(--border-subtle); border-top-left-radius: 18px; border-bottom-left-radius: 18px; }
  .premium-table tr td:last-child { border-right: 1px solid var(--border-subtle); border-top-right-radius: 18px; border-bottom-right-radius: 18px; }

  .table-responsive-premium { overflow-x: auto; }
  .portal-footer-signature { margin-top: 4rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 2rem; opacity: 0.6; }

  .badge-mini { background: var(--secondary); color: var(--primary); font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; margin-left: auto; box-shadow: var(--glow-secondary); }

  /* --- Admin Specific Redesign --- */
  .admin-dashboard-view { background-color: var(--primary-dark); padding: 3rem 4rem; }
  .db-header { margin-bottom: 3.5rem; }
  .db-title h1 { font-size: 2.2rem; letter-spacing: -1px; }

  .filter-select {
    background: var(--primary); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 0.8rem 1.2rem;
    font-size: 0.85rem; color: var(--white); font-weight: 600; cursor: pointer; transition: all 0.3s;
  }
  .filter-select:hover, .filter-select:focus { border-color: var(--secondary); background: var(--primary-light); }

  .btn-icon-header {
    width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border-subtle); background: var(--primary); color: var(--white);
    transition: all 0.3s; box-shadow: var(--shadow-premium);
  }
  .btn-icon-header:hover { background: var(--secondary); color: var(--primary); transform: translateY(-2px); box-shadow: var(--glow-secondary); }

  /* KPI Cards Admin */
  .kpi-card {
    background: var(--primary); border-radius: 22px; padding: 2rem; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-premium);
    transition: all 0.3s;
  }
  .kpi-card:hover { transform: translateY(-5px); border-color: var(--secondary); }
  .kpi-icon-wrapper {
    width: 60px; height: 60px; border-radius: 16px; background: var(--primary-light); color: var(--secondary); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .kpi-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; }
  .kpi-value { font-size: 2rem; font-weight: 800; margin: 0.5rem 0; color: var(--white); }
  .kpi-trend { font-size: 0.8rem; font-weight: 700; }
  .trend-up { color: var(--secondary); }
  .trend-down { color: var(--error); }

  /* Charts Admin */
  .chart-container { height: 280px; position: relative; margin-top: 1rem; }
  .card-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.8rem; color: var(--white); }
  .card-title i { color: var(--secondary); width: 22px; }

  /* Modal Premium */
  .modal-overlay { background: rgba(19, 21, 55, 0.85); backdrop-filter: blur(12px); }
  .modal-content.glass { background: var(--primary); border: 1px solid var(--border-subtle); padding: 3rem; border-radius: 24px; }
  .modal-header h3 { font-size: 1.6rem; color: var(--white); letter-spacing: -0.5px; }
  .btn-close-modal { color: var(--text-muted); background: var(--primary-light); padding: 0.6rem; border-radius: 50%; }
  .btn-close-modal:hover { background: var(--error); color: var(--white); }

  /* Notification Card Premium */
  .notification-card { background: var(--primary); border: 1px solid var(--border-subtle); padding: 4rem 3rem; border-radius: 24px; }
  .notif-icon.success { background: rgba(196, 229, 56, 0.1); color: var(--secondary); box-shadow: var(--glow-secondary); }
  .btn-notif-action { background: var(--secondary); color: var(--primary); font-weight: 800; box-shadow: var(--glow-secondary); border-radius: 14px; }
  .btn-notif-action:hover { background: var(--secondary-dark); transform: scale(1.02); }

  /* --- Scrollbar Customization --- */
  ::-webkit-scrollbar { width: 8px; }
