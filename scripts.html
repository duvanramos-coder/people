<script>
  /**
   * FRONTEND LOGIC - PEOPLE BPO
   * By Duvan Ramos 2026
   */

  window.onload = () => {
    initApp();
  };

  function initApp() {
    loadUserList();
    checkSession();
    setTimeout(() => {
      document.getElementById('loader').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
      }, 500);
    }, 100);
  }

  /**
   * Carga la lista de usuarios para el dropdown
   */
  function loadUserList() {
    google.script.run
      .withSuccessHandler((users) => {
        const select = document.getElementById('userSelect');
        select.innerHTML = '<option value="" disabled selected>Selecciona tu Nombre</option>';
        if (users && users.length > 0) {
          users.forEach(user => {
            const option = document.createElement('option');
            option.value = user;
            option.innerText = user;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option value="" disabled>No se encontraron asesores</option>';
        }
      })
      .withFailureHandler(() => {
        showToast('Error al cargar lista de asesores', 'error');
      })
      .getUsersList();
  }

  /**
   * Manejo de Inicio de Sesión
   */
  function handleLogin() {
    const name = document.getElementById('userSelect').value;
    const password = document.getElementById('password').value.trim();

    if (!name || !password) {
      showToast('Por favor selecciona tu nombre e ingresa la contraseña', 'error');
      return;
    }

    showLoader(true);

    google.script.run
      .withSuccessHandler((response) => {
        showLoader(false);
        if (response && response.success) {
          showToast(`¡Bienvenido, ${response.nombre}!`, 'success');
          saveSession(response);
          renderDashboard(response);
        } else {
          showToast(response.message || 'Error al iniciar sesión', 'error');
        }
      })
      .withFailureHandler((error) => {
        showLoader(false);
        showToast('Error de conexión con el servidor', 'error');
      })
      .verifyLogin(name, password);
  }

  /**
   * Cierre de Sesión
   */
  function handleLogout() {
    localStorage.removeItem('people_bpo_session');
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'flex';
    showToast('Sesión cerrada correctamente', 'success');
  }

  /**
   * Gestión de Sesión
   */
  function saveSession(user) {
    localStorage.setItem('people_bpo_session', JSON.stringify(user));
  }

  function checkSession() {
    const session = JSON.parse(localStorage.getItem('people_bpo_session'));
    if (session) {
      renderDashboard(session);
    }
  }

  /**
   * Renderizado del Dashboard
   */
  function renderDashboard(user) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';

    const firstName = user.nombre.split(' ')[0];
    document.getElementById('userName').innerText = firstName;
    document.getElementById('userCampaign').innerText = user.canal || 'Sin Canal';
    document.getElementById('userAvatar').innerText = user.nombre.substring(0, 2).toUpperCase();

    fetchShifts(user.nombre);
  }

  /**
   * Obtención de Turnos
   */
  function fetchShifts(name) {
    const shiftsGrid = document.getElementById('shiftsGrid');
    shiftsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;">Cargando tus turnos de la semana...</div>';

    google.script.run
      .withSuccessHandler((shifts) => {
        shiftsGrid.innerHTML = '';
        if (shifts && shifts.length > 0) {
          // Sort by date if possible
          shifts.forEach(shift => {
            shiftsGrid.innerHTML += createShiftCard(shift);
          });
        } else {
          shiftsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #999;">No tienes turnos registrados para esta semana.</div>';
        }
      })
      .withFailureHandler(() => {
        shiftsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #dc3545;">Error al cargar turnos.</div>';
      })
      .getShiftsForUser(name);
  }

  /**
   * Plantilla para las tarjetas de turno
   */
  function createShiftCard(shift) {
    const isRestDay = shift.horario.toLowerCase().includes('descanso');

    return `
      <div class="shift-card fade-in">
        <div class="shift-header">
          <div class="shift-date">${shift.fecha}</div>
          <div class="shift-week">Semana ${shift.semana}</div>
        </div>

        <div class="shift-body">
          <div class="info-item">
            <span class="info-label">Campaña</span>
            <span class="info-value">${shift.campaña}</span>
          </div>
          <div class="info-item">
            <span class="info-label">Subcampaña</span>
            <span class="info-value">${shift.subcampaña}</span>
          </div>

          <div class="highlight-box">
            <div class="highlight-item">
              <span class="highlight-label">Horario</span>
              <span class="highlight-time">${shift.horario}</span>
            </div>
            ${!isRestDay ? `
              <div class="highlight-item">
                <span class="highlight-label">Almuerzo</span>
                <span class="highlight-time">${shift.almuerzo}</span>
              </div>
            ` : ''}
          </div>

          ${!isRestDay ? `
            <div class="info-item" style="margin-top: 10px;">
              <div class="info-sub-item">
                <span class="info-label">Break Mañana</span>
                <span class="info-value">${shift.break_mañana}</span>
              </div>
              <div class="info-sub-item" style="margin-top: 5px;">
                <span class="info-label">Break Tarde</span>
                <span class="info-value">${shift.break_tarde}</span>
              </div>
            </div>
          ` : ''}

          ${shift.observacion && shift.observacion !== '-' ? `
            <div class="observation">
              <strong>Nota:</strong> ${shift.observacion}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  /**
   * UI Helpers
   */
  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;

    const icon = type === 'success' ? 'check_circle' : 'error';

    toast.innerHTML = `
      <span class="material-icons toast-icon">${icon}</span>
      <span style="font-size: 14px; font-weight: 500;">${message}</span>
    `;

    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 100);

    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  function showLoader(visible) {
    const loader = document.getElementById('loader');
    if (visible) {
      loader.style.display = 'flex';
      loader.style.opacity = '1';
    } else {
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    }
  }
</script>
