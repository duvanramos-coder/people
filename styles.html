<style>
    :root {
        --primary: #B7D400;
        --primary-glow: rgba(183, 212, 0, 0.4);
        --primary-dark: #96af00;
        --bg-dark: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent: #6366f1;
        --accent-glow: rgba(99, 102, 241, 0.4);
        --success: #22c55e;
        --warning: #eab308;
        --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
        background: radial-gradient(circle at top right, #1e293b, #0f172a);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    .bg-blob { position: fixed; width: 600px; height: 600px; background: var(--accent); filter: blur(180px); opacity: 0.12; z-index: -1; border-radius: 50%; }
    .container { width: 100%; max-width: 500px; padding: 24px; z-index: 1; }
    .dashboard-container { max-width: 1400px; width: 95%; margin: 60px auto; }

    .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        padding: 48px;
        box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .login-card { animation: float 6s ease-in-out infinite, fadeIn 0.8s ease-out; }
    .login-card:hover, .login-card:focus-within { animation-play-state: paused; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    .header { text-align: center; margin-bottom: 40px; }
    .logo-text {
        font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
        background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px var(--primary-glow));
    }
    .tagline { color: var(--text-dim); font-size: 14px; text-transform: uppercase; letter-spacing: 4px; margin-top: 8px; font-weight: 600; }

    .input-group { margin-bottom: 24px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1.5px; }
    select, input {
        width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
        padding: 16px 24px; border-radius: 16px; color: white; font-size: 15px; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(183, 212, 0, 0.15); background: rgba(0,0,0,0.5); }
    select option { background: #0f172a; color: white; }

    .btn-primary {
        width: 100%; background: var(--primary); color: #0f172a; border: none; padding: 18px;
        border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 12px 24px -6px var(--primary-glow);
    }
    .btn-primary:hover { transform: translateY(-3px); background: var(--primary-dark); box-shadow: 0 16px 32px -8px var(--primary-glow); }

    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 40px; }
    .metric-card {
        background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); padding: 32px 24px; border-radius: 24px; text-align: center;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden;
    }
    .metric-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05)); opacity: 0; transition: opacity 0.4s; }
    .metric-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4); }
    .metric-card:hover::before { opacity: 1; }
    .metric-title { color: var(--text-dim); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 2px; }
    .metric-value { font-size: 38px; font-weight: 800; color: white; letter-spacing: -1.5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }

    .progress-section { margin: 60px 0; background: rgba(255, 255, 255, 0.02); padding: 40px; border-radius: 28px; border: 1px solid var(--glass-border); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .progress-label { font-size: 13px; color: var(--text-dim); font-weight: 700; letter-spacing: 1.5px; }
    .progress-amount { font-size: 22px; font-weight: 800; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
    .progress-track { width: 100%; height: 20px; background: rgba(0, 0, 0, 0.5); border-radius: 100px; border: 1px solid var(--glass-border); position: relative; overflow: hidden; box-shadow: inset 0 2px 6px rgba(0,0,0,0.5); }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary) 0%, #fff 100%); border-radius: 100px; transition: width 2s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; }
    .progress-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 2s infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    .bono-tooltip {
        position: absolute; background: #fff; color: #0f172a; padding: 14px 18px; border-radius: 16px; font-size: 13px;
        display: none; z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.6); font-weight: 700; line-height: 1.4;
    }

    .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 32px; margin-top: 48px; }
    .chart-box { background: rgba(0, 0, 0, 0.35); padding: 40px; border-radius: 32px; border: 1px solid var(--glass-border); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5); transition: transform 0.3s; }
    .chart-box:hover { transform: scale(1.01); }

    .table-container { margin-top: 48px; overflow-x: auto; border-radius: 32px; border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.35); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { background: rgba(255, 255, 255, 0.04); padding: 24px; text-align: left; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; border-bottom: 1px solid var(--glass-border); }
    td { padding: 20px 24px; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: #cbd5e1; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); color: #fff; }

    .logout-btn { position: absolute; top: 32px; right: 48px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: white; padding: 12px 24px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.3s; letter-spacing: 1px; }
    .logout-btn:hover { background: var(--danger); border-color: var(--danger); color: white; transform: scale(1.05); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }

    .footer { text-align: center; margin-top: 50px; font-size: 11px; color: var(--text-dim); opacity: 0.7; font-weight: 600; letter-spacing: 1px; }

    #loader { position: fixed; inset: 0; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
    .spinner { width: 64px; height: 64px; border: 6px solid rgba(183, 212, 0, 0.1); border-top: 6px solid var(--primary); border-radius: 50%; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; filter: drop-shadow(0 0 10px var(--primary-glow)); }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
        .glass-card { padding: 40px 24px; }
        .charts-row { grid-template-columns: 1fr; }
        .metric-value { font-size: 32px; }
        .header { text-align: left; }
        .logout-btn { position: static; margin-bottom: 20px; width: 100%; display: block; text-align: center; }
    }
</style>
