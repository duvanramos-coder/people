<div class="login-screen">
    <div class="login-card">
        <h1>Admin Portal</h1>
        <p>Inicia sesión para gestionar el dashboard corporativo</p>

        <div id="login-error" style="color: var(--error); font-size: 0.875rem; text-align: center; margin-bottom: 1rem; display: none;">
            Credenciales incorrectas. Intenta de nuevo.
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" required placeholder="tu.usuario">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="login-btn">
                Entrar al Sistema
            </button>
        </form>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-muted);">
            &copy; 2026 People BPO Admin Portal. By Duvan Ramos.
        </div>
    </div>
</div>
