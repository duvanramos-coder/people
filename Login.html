<div id="loginView" class="view-container active">
  <div class="login-wrapper">
    <div class="login-card premium-card">
      <div class="login-brand">
        <div class="logo-shield">
          <i data-lucide="shield-check"></i>
        </div>
        <p class="brand-welcome">BIENVENIDO A</p>
        <h2 class="brand-name">PEOPLE BPO</h2>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="login-form">
        <div class="form-group">
          <label class="input-label">SELECCIONAR PERFIL</label>
          <div class="input-wrapper">
            <select id="agentSelect" required class="premium-select">
              <option value="" disabled selected>Cargando perfiles...</option>
            </select>
            <i data-lucide="user" class="input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="input-label">CONTRASEÑA</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required class="premium-input">
            <i data-lucide="lock" class="input-icon"></i>
          </div>
        </div>

        <button type="submit" class="btn-premium-login" id="btnLogin">
          <span>Autenticar y Entrar</span>
          <i data-lucide="log-in"></i>
        </button>
      </form>

      <div id="loginError" class="login-error-toast" style="display: none;"></div>

      <div class="login-footer-premium">
        <p>SYSTEM VERSION 4.0 — BY DUVAN RAMOS</p>
      </div>
    </div>
  </div>
</div>
