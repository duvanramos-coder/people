<div id="loginView" class="view-container active">
  <div class="login-wrapper">
    <div class="login-card card">
      <div class="brand-centered">
        <div class="logo-icon-large">P</div>
        <h2>¡Bienvenido!</h2>
        <p class="welcome-text">Prepárate para gestionar comunicación PQRSF</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="agentSelect">Selecciona tu nombre</label>
          <div class="input-wrapper">
            <i data-lucide="users"></i>
            <select id="agentSelect" required>
              <option value="" disabled selected>Cargando agentes...</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
          <span>Ingresar al Sistema</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>

      <div id="loginError" class="login-error" style="display: none;"></div>

      <div class="login-footer">
        <p class="signature">By Duvan Ramos — 2026</p>
      </div>
    </div>
  </div>
</div>
