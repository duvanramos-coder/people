<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRA TU PQRSF REALIZADO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #312B50;
      --secondary: #BEDC16;
      --accent: #7c69ff;
      --text-dark: #1a1a1a;
      --text-muted: #666;
      --text-light: #fff;
      --bg-gradient: radial-gradient(circle at top left, #312B50, #1e1a32);
      --glass: rgba(255, 255, 255, 0.98);
      --input-bg: #f8fafc;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-dark);
      padding: 20px;
      overflow-x: hidden;
    }

    /* BACKGROUND ORBS */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.4;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; right: -50px; }

    .container {
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.8s ease-out;
    }

    .card {
      background: var(--glass);
      border-radius: 32px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: var(--primary);
      color: var(--text-light);
      padding: 40px 30px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header .company {
      font-size: 15px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header .author {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 10px;
      font-weight: 400;
    }

    .accent-bar {
      height: 6px;
      background: linear-gradient(90deg, var(--secondary) 0%, #d4ff00 100%);
    }

    .content {
      padding: 40px;
    }

    .welcome-text {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome-text h2 {
      font-size: 20px;
      color: var(--primary);
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
      padding-left: 4px;
    }

    input, select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #edf2f7;
      border-radius: 16px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--input-bg);
      color: var(--text-dark);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(49, 43, 80, 0.08);
      transform: translateY(-1px);
    }

    input::placeholder {
      color: #a0aec0;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 20px -5px rgba(49, 43, 80, 0.3);
    }

    button:hover {
      background: #3d3564;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px -10px rgba(49, 43, 80, 0.4);
    }

    button:active {
      transform: translateY(0) scale(0.98);
    }

    .logout-btn {
      background: transparent;
      color: #e53e3e;
      border: 2px solid #fed7d7;
      padding: 10px 20px;
      font-size: 13px;
      margin: 30px auto 0;
      width: auto;
      box-shadow: none;
    }

    .logout-btn:hover {
      background: #fff5f5;
      border-color: #feb2b2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(229, 62, 62, 0.1);
    }

    /* SEARCHABLE DROPDOWN */
    .search-box {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      border: 1px solid #f0f0f0;
      animation: dropdownFade 0.3s ease;
    }

    @keyframes dropdownFade {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .search-results div {
      padding: 14px 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      border-bottom: 1px solid #f8f9fa;
    }

    .search-results div:last-child {
      border-bottom: none;
    }

    .search-results div:hover {
      background: #f7fafc;
      color: var(--primary);
      padding-left: 25px;
      font-weight: 500;
    }

    /* LOADER */
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: white;
      padding: 16px 32px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 15px;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      font-size: 20px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="card">
    <div class="header">
      <p class="company">People BPO</p>
      <h1>Bienvenido</h1>
      <p class="author">By Duvan Ramos</p>
    </div>
    <div class="accent-bar"></div>
    <div class="content">
      <div class="welcome-text">
        <h2>Inicia Sesión</h2>
        <p style="font-size: 14px; color: var(--text-muted); margin-top: 5px;">Selecciona tu nombre para continuar</p>
      </div>

      <div class="form-group">
        <label>Asesor</label>
        <select id="login-agente">
          <option value="">Seleccione su nombre</option>
          <option>Angi Johana Banda Montes</option>
          <option>Slendy Lizzeth Pico Garcia</option>
          <option>Heillen Tatiana Rincón Lizarazo</option>
          <option>Juliana Roa Aragonez</option>
          <option>Stefania Ortega Rodríguez</option>
          <option>Hadisha Faride Bitar Lerech</option>
          <option>Bleidis Farides Cabarcas Charris</option>
          <option>Katherine Sofia Nieto Guerra</option>
        </select>
      </div>

      <button onclick="login()">
        <span>Ingresar</span>
        <div class="spinner"></div>
      </button>
    </div>
  </div>

  <!-- MAIN FORM SCREEN -->
  <div id="form-screen" class="card hidden">
    <div class="header">
      <p class="company">People BPO</p>
      <h1 id="user-greeting">Hola, Asesor</h1>
      <p class="author">By Duvan Ramos</p>
    </div>
    <div class="accent-bar"></div>
    <div class="content">
      <div class="form-group">
        <label>Número de radicado (PQRSF)</label>
        <input id="radicado" type="text" placeholder="Ej: PQ-12345678">
      </div>

      <div class="form-group">
        <label>Caso</label>
        <input id="caso" type="text" placeholder="Escribe el número de caso o motivo">
      </div>

      <div class="form-group">
        <label>Clasificación</label>
        <div class="search-box">
          <input id="clasificacion" onkeyup="filterList('clasificacion', 'list-clasificacion')" placeholder="Buscar clasificación..." autocomplete="off">
          <div id="list-clasificacion" class="search-results"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Se dirige a</label>
        <div class="search-box">
          <input id="dirige" onkeyup="filterList('dirige', 'list-dirige')" placeholder="Buscar departamento..." autocomplete="off">
          <div id="list-dirige" class="search-results"></div>
        </div>
      </div>

      <button id="submit-btn" onclick="registrar()">
        <span id="btn-text">Registrar PQRSF</span>
        <div id="btn-spinner" class="spinner"></div>
      </button>

      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </div>
</div>

<div id="toast">
  <span id="toast-icon" class="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script>
  const CLASIFICACIONES = [
    "(Felicitaciones) - FELICITACIONES",
    "(Solicitudes, sugerencias y peticiones) - PETICIÓN O SOLICITUD",
    "(Quejas, reclamos, denuncias) - QUEJA",
    "(Quejas, reclamos, denuncias) - RECLAMO",
    "(Quejas, reclamos, denuncias) - RECLAMO CUOTA MONETARIA Y/O REACTIVACIÓN",
    "(Quejas, reclamos, denuncias) - RECLAMO PROTECCIÓN DE DATOS",
    "(Quejas, reclamos, denuncias) - SOLICITUD DE RESARCIMIENTO",
    "(Solicitudes, sugerencias y peticiones) - SUGERENCIA"
  ];

  const AREAS = [
    "COLEGIO SAN MARTIN", "COLEGIO VILLAVICENCIO", "CONSEJO DIRECTIVO", "CONTABILIDAD GENERAL",
    "COORDINACION DE AFILIACIONES", "COORDINACION DE GESTION DOCUMENTAL", "COORDINACIÓN COMERCIAL",
    "COORDINACIÓN DE MERCADEO", "DIRECCION ADMINISTRATIVA", "DIVISION COMERCIAL Y DE MERCADEO",
    "DIVISION DE APORTES", "DIVISION DE CAPACITACIÓN EMPRESARIAL", "DIVISION DE RECREACION, DEPORTE Y TURISMO",
    "DIVISION DE SUBSIDIOS", "DIVISION DE TECNOLOGIAS DE LA INFORMACIÓN", "DIVISION DE TESORERIA",
    "DIVISIÓN DE ATENCIÓN A LA NIÑEZ", "DIVISIÓN DE GESTIÓN DE EMPLEO", "AREA DE PUBLICIDAD",
    "AREA DE CARTERA", "AREA DE CREDITO COFREM", "AREA DE CULTURA Y EVENTOS", "AREA DE MANTENIMIENTO",
    "AREA INFRAESTRUCTURA", "ASESORIA JURIDICA", "AUDITORIA INTERNA", "BIBLIOTECA",
    "CENTRO DE SERVICIOS PUERTO GAITAN", "CENTRO VACACIONAL CANEY", "CENTRO VACACIONAL YURIMENA",
    "CER", "COLEGIO ACACÍAS", "COLEGIO GUAMAL", "COLEGIO PUERTO LOPEZ", "COLEGIO RESTREPO",
    "DIVISIÓN DE GESTIÓN DE SIST. CORPORATIVO", "DIVISIÓN DE GESTIÓN HUMANA", "DIVISIÓN DE LOGISTICA",
    "EDUCACION SUPERIOR", "FEDECAJAS", "INSTITUTO TECNICO COFREM", "MESA DE SERVICIOS", "NO DEFINIDA",
    "OFICINA MOVIL RUBIALES", "PARQUE DE LA VIDA VILLAVICENCIO", "PARQUE VACACIONAL ARIARI",
    "PLANEACIÓN CORPORATIVA", "PUNTO DE INFORMACIÓN", "SERVICIO AL CLIENTE",
    "SUBDIRECCION ADMINISTRATIVA Y FINANCIERA", "SUBDIRECCION DE PROGRAMAS SOCIALES",
    "SUBDIRECCION DE SERVICIOS SOCIALES", "SUBDIRECCIÓN EDUCACIÓN", "TURISMO SOCIAL",
    "ZONA CENTRO", "ZONA NORTE", "ZONA ORIENTE", "ZONA SUR", "ÁREA DE VIVIENDA"
  ];

  let currentAgent = "";

  window.onload = function() {
    const savedAgent = localStorage.getItem('pqrsf_agent');
    if (savedAgent) {
      showForm(savedAgent);
    }

    populateList('list-clasificacion', CLASIFICACIONES, 'clasificacion');
    populateList('list-dirige', AREAS, 'dirige');

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-box')) {
        document.querySelectorAll('.search-results').forEach(el => el.style.display = 'none');
      }
    });
  };

  function populateList(listId, data, inputId) {
    const list = document.getElementById(listId);
    list.innerHTML = "";
    data.forEach(item => {
      const div = document.createElement('div');
      div.textContent = item;
      div.onclick = function() {
        document.getElementById(inputId).value = item;
        list.style.display = 'none';
      };
      list.appendChild(div);
    });
  }

  function filterList(inputId, listId) {
    const input = document.getElementById(inputId);
    const filter = input.value.toLowerCase();
    const list = document.getElementById(listId);
    const items = list.getElementsByTagName('div');
    let hasResults = false;

    if (filter === "") {
      list.style.display = 'none';
      return;
    }

    for (let i = 0; i < items.length; i++) {
      const txtValue = items[i].textContent || items[i].innerText;
      if (txtValue.toLowerCase().indexOf(filter) > -1) {
        items[i].style.display = "";
        hasResults = true;
      } else {
        items[i].style.display = "none";
      }
    }
    list.style.display = hasResults ? 'block' : 'none';
  }

  function login() {
    const agente = document.getElementById('login-agente').value;
    if (!agente) {
      showToast('⚠️ Selecciona tu nombre', 'error');
      return;
    }
    localStorage.setItem('pqrsf_agent', agente);
    showForm(agente);
  }

  function logout() {
    localStorage.removeItem('pqrsf_agent');
    document.getElementById('form-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-agente').value = "";
  }

  function showForm(agente) {
    currentAgent = agente;
    document.getElementById('user-greeting').textContent = 'Hola, ' + agente.split(' ')[0];
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('form-screen').classList.remove('hidden');
  }

  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toast-icon');
    const msg = document.getElementById('toast-message');

    icon.textContent = type === 'success' ? '✨' : '⚠️';
    msg.textContent = message;

    toast.className = 'show';
    setTimeout(() => { toast.className = ''; }, 4000);
  }

  function registrar() {
    const radicado = document.getElementById('radicado').value;
    const caso = document.getElementById('caso').value;
    const clasificacion = document.getElementById('clasificacion').value;
    const dirige = document.getElementById('dirige').value;

    if (!radicado || !caso || !clasificacion || !dirige) {
      showToast('⚠️ Completa todos los campos', 'error');
      return;
    }

    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('btn-spinner');

    btn.disabled = true;
    btnText.style.opacity = '0.5';
    spinner.style.display = 'block';

    const data = {
      agente: currentAgent,
      radicado: radicado,
      caso: caso,
      clasificacion: clasificacion,
      dirige: dirige
    };

    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false;
      btnText.style.opacity = '1';
      spinner.style.display = 'none';

      if (res.estado === "ok") {
        showToast('¡Registro completado con éxito!');
        document.getElementById('radicado').value = "";
        document.getElementById('caso').value = "";
        document.getElementById('clasificacion').value = "";
        document.getElementById('dirige').value = "";
      } else if (res.estado === "duplicado") {
        showToast('Ya registrado por ' + res.agente, 'error');
      } else {
        showToast('Error en el servidor', 'error');
      }
    }).withFailureHandler(function() {
      btn.disabled = false;
      btnText.style.opacity = '1';
      spinner.style.display = 'none';
      showToast('Error de conexión', 'error');
    }).guardarPQRSF(data);
  }
</script>

</body>
</html>
