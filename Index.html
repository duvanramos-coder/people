<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #312B50;
  --secondary: #BEDC16;
  --bg: #F8F9FD;
  --white: #FFFFFF;
  --text-main: #312B50;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --success: #10B981;
  --error: #EF4444;
  --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top left, #312B50 0%, #1A162D 100%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 30px;
  color: var(--white);
  animation: fadeInDown 0.8s ease-out;
}

header h2 {
  font-weight: 700;
  letter-spacing: -0.5px;
  font-size: 28px;
  margin-bottom: 5px;
}

header small {
  opacity: 0.7;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.container {
  width: 100%;
  max-width: 700px;
  perspective: 1000px;
}

.card {
  background: var(--white);
  padding: 40px;
  border-radius: 24px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  animation: cardEntrance 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: var(--secondary);
}

h3 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 25px;
  color: var(--primary);
}

.form-group {
  margin-bottom: 20px;
  animation: fadeInUp 0.5s ease-out forwards;
  opacity: 0;
}

.form-group:nth-child(1) { animation-delay: 0.1s; }
.form-group:nth-child(2) { animation-delay: 0.2s; }
.form-group:nth-child(3) { animation-delay: 0.3s; }

label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: block;
}

input, select, textarea {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  transition: all 0.3s ease;
  background: #F9FAFB;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 4px rgba(49, 43, 80, 0.1);
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.checks {
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 12px;
  margin: 25px 0;
}

@media (min-width: 600px) {
  .checks {
    grid-template-columns: repeat(2, 1fr);
  }
}

.check-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 12px;
  font-weight: 500;
}

.check-item:hover {
  background: #F3F4F6;
}

.check-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--primary);
}

.check-item.active {
  border-color: var(--primary);
  background: rgba(49, 43, 80, 0.05);
}

.btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  font-size: 16px;
  background: var(--secondary);
  color: var(--primary);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  filter: brightness(1.05);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  background: #E5E7EB;
  color: #9CA3AF;
  cursor: not-allowed;
  transform: none;
}

.brand {
  text-align: center;
  margin-top: 25px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 500;
}

/* POPUP / MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(26, 22, 45, 0.8);
  backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal {
  background: white;
  padding: 40px;
  border-radius: 24px;
  text-align: center;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  transform: scale(0.9);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal.active {
  transform: scale(1);
  opacity: 1;
}

.modal-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 40px;
}

.modal-icon.success {
  background: rgba(16, 185, 129, 0.1);
  color: var(--success);
}

.modal-icon.error {
  background: rgba(239, 68, 68, 0.1);
  color: var(--error);
}

.modal h3 {
  margin-bottom: 10px;
}

.modal p {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 25px;
  line-height: 1.6;
}

.modal-btn {
  padding: 12px 30px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.modal-btn.primary {
  background: var(--primary);
  color: white;
}

/* LOADER */
.loader-spinner {
  width: 20px;
  height: 20px;
  border: 3px solid rgba(49, 43, 80, 0.3);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* KEYFRAMES */
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardEntrance {
  from { opacity: 0; transform: translateY(40px) rotateX(-5deg); }
  to { opacity: 1; transform: translateY(0) rotateX(0); }
}

/* LOGIN STYLES */
.login-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top left, #312B50 0%, #1A162D 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 20px;
}

.login-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(15px);
  padding: 50px 40px;
  border-radius: 32px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  width: 100%;
  max-width: 450px;
  text-align: center;
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
  animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.login-card h1 {
  color: var(--white);
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 5px;
}

.login-card h2 {
  color: var(--secondary);
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

.login-card .brand-name {
  color: rgba(255, 255, 255, 0.5);
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 40px;
}

.login-card select {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  margin-bottom: 25px;
  height: 55px;
  font-size: 16px;
}

.login-card select option {
  background: #312B50;
  color: white;
}

.logout-container {
  position: absolute;
  top: 20px;
  right: 20px;
}

.btn-logout {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  padding: 8px 15px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(255, 255, 255, 0.2);
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-logout:hover {
  background: var(--error);
  border-color: var(--error);
}

</style>
</head>

<body>

<!-- LOGIN VIEW -->
<div class="login-overlay" id="loginOverlay" style="display: none;">
  <div class="login-card">
    <div class="brand-name">People BPO</div>
    <h1>¡Bienvenido!</h1>
    <h2>Registro de Radicados</h2>

    <select id="loginUser">
      <option value="">Selecciona tu nombre...</option>
      <option>Maria Aragones</option>
      <option>Laura Buitrago</option>
      <option>Joselyn Mendoza</option>
    </select>

    <button class="btn" onclick="login()">Ingresar</button>
    <p class="brand" style="margin-top: 40px; color: rgba(255,255,255,0.4);">By Duvan Ramos · 2026</p>
  </div>
</div>

<div class="logout-container" id="logoutContainer" style="display: none;">
  <button class="btn-logout" onclick="logout()">
    <span>Cerrar Sesión</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
  </button>
</div>

<header>
  <h2>RADICACIÓN - GESTIONES</h2>
  <small>SISTEMA DE GESTIÓN INTERNA</small>
</header>

<div class="container" id="mainContainer" style="display: none;">
  <div class="card">
    <h3 style="text-align: center;">Registrar nueva gestión</h3>
    <p id="welcomeMessage" style="text-align: center; margin-bottom: 20px; font-weight: 500; color: var(--text-muted);"></p>

    <div class="form-group" style="display: none;">
      <label for="funcionaria">Funcionaria responsable</label>
      <select id="funcionaria">
        <option value="">Seleccione una funcionaria...</option>
        <option>Maria Aragones</option>
        <option>Laura Buitrago</option>
        <option>Joselyn Mendoza</option>
      </select>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="devuelto">¿Devuelto por errores?</label>
        <select id="devuelto">
          <option value="N/A">N/A</option>
          <option>No</option>
          <option>Sí</option>
          <option>Gestionado por otro funcionario</option>
        </select>
      </div>

      <div class="form-group">
        <label for="radicado">Número de radicado</label>
        <input type="text" id="radicado" placeholder="Ingrese el número">
      </div>
    </div>

    <div class="form-group">
      <label for="observacion">Observaciones detalladas</label>
      <textarea id="observacion" placeholder="Escriba aquí las observaciones pertinentes..."></textarea>
    </div>

    <div class="checks">
      <label class="check-item" onclick="toggleCheck(this)">
        <input type="checkbox" id="recibidoHoy">
        <span>SNC Recibido hoy</span>
      </label>

      <label class="check-item" onclick="toggleCheck(this)">
        <input type="checkbox" id="solucionadoHoy">
        <span>SNC Solucionado hoy</span>
      </label>

      <label class="check-item" onclick="toggleCheck(this)">
        <input type="checkbox" id="enProceso">
        <span>SNC en proceso</span>
      </label>

      <label class="check-item" onclick="toggleCheck(this)">
        <input type="checkbox" id="pqrsf">
        <span>RADICADO</span>
      </label>
    </div>

    <button class="btn" id="submitBtn" onclick="enviar()">
      <span id="btnText">📥 Registrar gestión</span>
      <div class="loader-spinner" id="btnLoader"></div>
    </button>

    <p class="brand">By Duvan Ramos · 2026</p>
  </div>
</div>

<!-- MODAL SYSTEM -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>
    <button class="modal-btn primary" onclick="closeModal()">Entendido</button>
  </div>
</div>


<script>
// SESSION LOGIC
window.onload = function() {
  const savedUser = localStorage.getItem('radicacion_user');
  if (savedUser) {
    initSession(savedUser);
  } else {
    document.getElementById('loginOverlay').style.display = 'flex';
  }
};

function login() {
  const user = document.getElementById('loginUser').value;
  if (!user) {
    showModal("Error", "Por favor selecciona tu nombre.", "error");
    return;
  }
  localStorage.setItem('radicacion_user', user);
  initSession(user);
}

function logout() {
  localStorage.removeItem('radicacion_user');
  document.getElementById('mainContainer').style.display = 'none';
  document.getElementById('logoutContainer').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginUser').value = "";
}

function initSession(user) {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('mainContainer').style.display = 'block';
  document.getElementById('logoutContainer').style.display = 'block';
  document.getElementById('funcionaria').value = user;
  document.getElementById('welcomeMessage').innerText = "Hola, " + user + ". ¿Qué gestionaremos hoy?";
}

function toggleCheck(el) {
  el.classList.toggle('active');
}

function showModal(title, message, type) {
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modal');
  const icon = document.getElementById('modalIcon');
  const titleEl = document.getElementById('modalTitle');
  const messageEl = document.getElementById('modalMessage');

  titleEl.innerText = title;
  messageEl.innerText = message;

  if (type === 'error') {
    icon.innerHTML = '✕';
    icon.className = 'modal-icon error';
  } else {
    icon.innerHTML = '✓';
    icon.className = 'modal-icon success';
  }

  overlay.style.display = 'flex';
  setTimeout(() => modal.classList.add('active'), 10);
}

function closeModal() {
  const modal = document.getElementById('modal');
  const overlay = document.getElementById('modalOverlay');
  modal.classList.remove('active');
  setTimeout(() => overlay.style.display = 'none', 300);
}

function setLoader(loading) {
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const loader = document.getElementById('btnLoader');

  if (loading) {
    btn.disabled = true;
    btnText.style.opacity = '0';
    loader.style.display = 'block';
  } else {
    btn.disabled = false;
    btnText.style.opacity = '1';
    loader.style.display = 'none';
  }
}

function resetForm() {
  // No vaciamos la funcionaria porque es el usuario logueado
  document.getElementById("devuelto").value = "N/A";
  document.getElementById("radicado").value = "";
  document.getElementById("observacion").value = "";
  document.getElementById("recibidoHoy").checked = false;
  document.getElementById("solucionadoHoy").checked = false;
  document.getElementById("enProceso").checked = false;
  document.getElementById("pqrsf").checked = false;

  // Reset active classes on check labels
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('active'));
}

function enviar() {
  const data = {
    funcionaria: document.getElementById("funcionaria").value,
    devuelto: document.getElementById("devuelto").value,
    radicado: document.getElementById("radicado").value,
    observacion: document.getElementById("observacion").value,
    recibidoHoy: document.getElementById("recibidoHoy").checked,
    solucionadoHoy: document.getElementById("solucionadoHoy").checked,
    enProceso: document.getElementById("enProceso").checked,
    pqrsf: document.getElementById("pqrsf").checked
  };

  if (!data.funcionaria) {
    showModal("Dato requerido", "Por favor, seleccione una funcionaria antes de continuar.", "error");
    return;
  }

  setLoader(true);

  google.script.run
    .withSuccessHandler(function() {
      setLoader(false);
      showModal("¡Excelente!", "La gestión ha sido registrada correctamente en el sistema.", "success");
      resetForm();
    })
    .withFailureHandler(function(e) {
      setLoader(false);
      showModal("Error en el registro", e.message, "error");
    })
    .guardarRadicacion(data);
}
</script>

</body>
</html>
