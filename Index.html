<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title><?= isShared ? 'Conversación Compartida' : 'Generador de Chat AWS' ?></title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <?!= include('Styles'); ?>
</head>

<body>
  <div class="app-container">
    <div class="header">
      <?= isShared ? 'Conversación Guardada' : 'Visor de Transcripción AWS' ?>
    </div>

    <? if (!isShared) { ?>
    <div class="controls">
      <div class="file-input-wrapper">
        <span class="btn-file" id="file-label">Seleccionar Transcripción (JSON)</span>
        <input type="file" id="fileInput" accept=".json" onchange="document.getElementById('file-label').innerText = this.files[0].name">
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="procesar()">
          <span>💬</span> Generar Chat
        </button>
        <button class="btn-share" onclick="compartir()">
          <span>🔗</span> Compartir
        </button>
        <button class="btn-secondary" onclick="descargarPDF()">
          <span>📄</span> PDF
        </button>
        <button class="btn-secondary" onclick="descargarImagen()">
          <span>🖼️</span> Imagen
        </button>
      </div>
    </div>
    <? } ?>

    <div id="chat">
      <? if (!isShared) { ?>
      <div style="text-align: center; color: #777; margin-top: 50px; font-size: 0.9rem;">
        Sube un archivo JSON para visualizar la conversación.
      </div>
      <? } ?>
    </div>

    <div id="link-container">
      <div style="font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #01579b;">Link de acceso rápido:</div>
      <a href="#" id="link-display" target="_blank"></a>
      <button class="copy-btn" onclick="copiarLink()">Copiar Enlace</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Pasar datos del servidor al cliente
    window.sharedData = <?!= sharedChatData ?>;
  </script>

  <?!= include('Scripts'); ?>
</body>
</html>
