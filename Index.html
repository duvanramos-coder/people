<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Conmutador People BPO | Elite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2E2A4F;
      --accent: #B4D800;
      --accent-dark: #9cbd00;
      --accent-soft: rgba(180, 216, 0, 0.15);
      --bg-gradient: linear-gradient(135deg, #1e1b3a 0%, #2E2A4F 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #1A1A1A;
      --text-muted: #666666;
      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.15);
      --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* LOGIN ANIMATION */
    #login-screen {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 60px;
      text-align: center;
      box-shadow: var(--shadow-premium);
      max-width: 480px;
      margin: auto;
      animation: reveal 1s ease-out;
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .brand-logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* FORM ELEMENTS */
    .field-label {
      display: block;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      margin-left: 5px;
      text-transform: uppercase;
    }

    .custom-select, .modern-input {
      width: 100%;
      height: 60px;
      background: #f4f4f7;
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 0 20px;
      font-size: 16px;
      font-family: inherit;
      transition: var(--transition-smooth);
      outline: none;
      color: var(--primary);
    }

    .custom-select:focus, .modern-input:focus {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    .btn-action {
      width: 100%;
      height: 60px;
      background: var(--accent);
      color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 10px 30px rgba(180, 216, 0, 0.3);
      margin-top: 20px;
    }

    .btn-action:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px rgba(180, 216, 0, 0.4);
      background: var(--accent-dark);
    }

    /* DASHBOARD LAYOUT */
    #dashboard {
      display: none;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      padding: 15px 30px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      color: white;
    }

    .profile-section { display: flex; align-items: center; gap: 15px; }
    .profile-avatar {
      width: 45px; height: 45px;
      background: var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: var(--primary); font-size: 20px;
    }

    .logout-link {
      color: #ff8e8e;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.8;
      transition: 0.3s;
    }
    .logout-link:hover { opacity: 1; text-decoration: underline; }

    /* DYNAMIC SCRIPT CARD */
    .script-viewer {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 45px;
      box-shadow: var(--shadow-premium);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .script-viewer::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 6px; height: 100%;
      background: var(--accent);
    }

    .script-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-dark);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      display: block;
    }

    .phrase-container {
      font-size: 24px;
      line-height: 1.5;
      font-weight: 500;
      color: var(--primary);
      transition: var(--transition-smooth);
    }

    .highlight-accent {
      color: var(--accent-dark);
      font-weight: 700;
      position: relative;
      display: inline-block;
    }

    /* SCENARIO BAR */
    .scenario-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-scenario {
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-scenario:hover {
      background: var(--accent);
      color: var(--primary);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* SEARCH BAR */
    .search-box {
      position: relative;
      margin-bottom: 25px;
    }

    .search-input-elite {
      width: 100%;
      height: 75px;
      border-radius: var(--radius-md);
      border: none;
      padding: 0 30px 0 75px;
      font-size: 20px;
      background: var(--card-bg);
      box-shadow: var(--shadow-premium);
      font-family: inherit;
      outline: none;
      color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      opacity: 0.5;
    }

    /* RESULTS GRID */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .mini-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 20px;
      cursor: pointer;
      transition: var(--transition-smooth);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .mini-card:hover {
      transform: scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }

    .mini-card h4 {
      font-size: 16px;
      color: var(--primary);
      font-weight: 700;
    }

    .mini-card span {
      font-size: 13px;
      color: var(--accent-dark);
      font-weight: 800;
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 8px;
      align-self: flex-start;
    }

    /* FOOTER */
    .footer-elite {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      margin-top: 40px;
      letter-spacing: 1px;
      font-weight: 500;
    }

    /* LOADING ANIMATION */
    .elite-loader {
      display: none;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(180, 216, 0, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .scenario-bar { grid-template-columns: 1fr; }
      .script-viewer { padding: 30px; font-size: 18px; }
      #login-screen { padding: 30px; }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
      <div class="brand-logo">SCRIPT CONMUTADOR</div>
      <div class="brand-tagline">People BPO Elite</div>

      <div style="margin-bottom: 30px;">
        <label class="field-label">Selecciona tu Perfil</label>
        <select id="user-select" class="custom-select">
          <option value="" disabled selected>Cargando asesores...</option>
        </select>
      </div>

      <button class="btn-action" onclick="login()">Acceder al Sistema</button>

      <div style="margin-top: 40px; font-size: 11px; color: #bbb;">
        Seguridad People Academy Pro 2026
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
      <nav class="top-nav">
        <div class="profile-section">
          <div class="profile-avatar" id="user-avatar">?</div>
          <div>
            <div id="advisor-name-display" style="font-weight: 700; font-size: 15px;">Nombre Asesor</div>
            <div id="nav-greeting" style="font-size: 11px; opacity: 0.7; font-weight: 600; text-transform: uppercase;">Estado: Activo</div>
          </div>
        </div>
        <a class="logout-link" onclick="logout()">Finalizar Turno</a>
      </nav>

      <!-- DYNAMIC SCRIPT VIEWER -->
      <div class="script-viewer" id="script-container">
        <span class="script-tag" id="script-phase-tag">Paso 1: Bienvenida</span>
        <div class="phrase-container" id="phrase-text">
          <!-- El script aparecerá aquí dinámicamente -->
        </div>
      </div>

      <!-- BOTONES DE ESCENARIO -->
      <div class="scenario-bar" style="grid-template-columns: repeat(5, 1fr);">
        <button class="btn-scenario" onclick="setScript('SALUDO')" title="Reiniciar">
          🔄 Saludo
        </button>
        <button class="btn-scenario" onclick="setScript('LINEA_AMIGA')" title="Línea Amiga">
          🆘 L. Amiga
        </button>
        <button class="btn-scenario" onclick="setScript('EMPLEO')" title="Agencia Empleo">
          💼 Empleo
        </button>
        <button class="btn-scenario" onclick="setScript('INSISTENCIA')" title="Insistencia del Usuario">
          ⚠️ Insistencia
        </button>
        <button class="btn-scenario" onclick="setScript('ERROR')" title="Error de Transferencia">
          🔌 Error
        </button>
      </div>

      <!-- BUSCADOR -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" class="search-input-elite" placeholder="Busca un área o extensión..." onkeyup="handleSearch()">
      </div>

      <div id="elite-loader" class="elite-loader"></div>

      <div id="results-grid" class="results-grid">
        <!-- Tarjetas dinámicas -->
      </div>

      <div class="footer-elite">
        SCRIPT CONMUTADOR PEOPLE BPO — BY DUVAN RAMOS 2026
      </div>
    </div>

  </div>

  <script>
    let currentAdvisor = "";
    let searchTimeout = null;

    // Configuración de Frases
    const getGreeting = () => {
      const hr = new Date().getHours();
      return hr < 12 ? "buenos días" : "buenas tardes";
    };

    const SCRIPTS = {
      SALUDO: () => `Hola, muy <span class="highlight-accent">${getGreeting()}</span>, se comunica con COFREM, le habla <span class="highlight-accent">${currentAdvisor}</span>, ¿en qué le puedo colaborar?`,
      ESPERA: () => `Claro que sí, con mucho gusto le colaboro. Permítame un momento por favor mientras valido la información para direccionar su llamada.`,
      TRANSFERENCIA: (area) => `Listo, muchísimas gracias. Lo voy a comunicar con el área de <span class="highlight-accent">${area}</span>. Deme un momento mientras realizo la transferencia. <strong>Por favor no cuelgue.</strong>`,
      LINEA_AMIGA: () => `Entiendo su solicitud. No obstante, <span class="highlight-accent">le recuerdo que se comunica con el conmutador de Cofrem</span> y esta línea es exclusivamente para direccionamiento. Para su requerimiento, lo remitiré a la Línea Amiga, donde profesionales expertos le brindarán la atención que necesita.`,
      EMPLEO: () => `Comprendo que busca información de empleo. Sin embargo, <span class="highlight-accent">le recuerdo que se comunica con el conmutador de Cofrem</span> y esta línea es de información general. Lo comunicaré de inmediato con la Agencia de Empleo para que reciba la asesoría correspondiente.`,
      INSISTENCIA: () => `Comprendo su malestar y le ofrezco una disculpa. Sin embargo, para poder ayudarle adecuadamente, <span class="highlight-accent">debo remitirlo con el área encargada</span>, ya que desde esta línea de conmutador no contamos con acceso a su historial. Permítame un momento por favor.`,
      ERROR: () => `Le pido una sincera disculpa, parece que hubo un error en la conexión anterior. <span class="highlight-accent">Deme un segundo</span> para intentar conectarlo nuevamente con el área correcta. Gracias por su paciencia.`
    };

    // Inicialización
    window.onload = function() {
      google.script.run.withSuccessHandler(users => {
        const select = document.getElementById('user-select');
        select.innerHTML = '<option value="" disabled selected>Selecciona tu nombre</option>';
        users.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u; opt.text = u;
          select.appendChild(opt);
        });
      }).obtenerUsuarios();
    };

    function login() {
      const select = document.getElementById('user-select');
      if (!select.value) return alert("Selecciona un asesor");

      currentAdvisor = select.value;
      document.getElementById('advisor-name-display').innerText = currentAdvisor;
      document.getElementById('user-avatar').innerText = currentAdvisor.charAt(0);

      setScript('SALUDO');

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
    }

    function logout() {
      location.reload();
    }

    /**
     * Actualiza el script visualmente con una pequeña animación
     */
    function setScript(type, param = "") {
      const textElement = document.getElementById('phrase-text');
      const tagElement = document.getElementById('script-phase-tag');

      // Animación de salida
      textElement.style.opacity = "0";
      textElement.style.transform = "translateY(5px)";

      setTimeout(() => {
        textElement.innerHTML = SCRIPTS[type](param);

        // Actualizar Tags
        const tags = {
          'SALUDO': 'Paso 1: Bienvenida',
          'ESPERA': 'Paso 2: Validación',
          'TRANSFERENCIA': 'Paso 3: Transferencia',
          'LINEA_AMIGA': 'Escenario: Línea Amiga',
          'EMPLEO': 'Escenario: Agencia Empleo',
          'INSISTENCIA': 'Escenario: Insistencia',
          'ERROR': 'Escenario: Error/Reintento'
        };
        tagElement.innerText = tags[type] || 'Script Dinámico';

        // Animación de entrada
        textElement.style.opacity = "1";
        textElement.style.transform = "translateY(0)";
      }, 200);
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.trim();
      const grid = document.getElementById('results-grid');
      const loader = document.getElementById('elite-loader');

      if (query.length === 0) {
        grid.innerHTML = '';
        setScript('SALUDO');
        return;
      }

      if (query.length < 2) return;

      // Al empezar a buscar, pasamos al script de ESPERA
      if (query.length === 2) setScript('ESPERA');

      clearTimeout(searchTimeout);
      loader.style.display = 'block';

      searchTimeout = setTimeout(() => {
        google.script.run.withSuccessHandler(results => {
          loader.style.display = 'none';
          grid.innerHTML = '';

          if (!results || results.length === 0) {
            grid.innerHTML = '<div style="color:white; opacity:0.5; grid-column:1/-1; text-align:center;">No hay coincidencias</div>';
            return;
          }

          results.forEach(res => {
            const card = document.createElement('div');
            card.className = 'mini-card';
            card.innerHTML = `
              <h4>${res.dependencia}</h4>
              <span>📞 ${res.extension}</span>
            `;
            card.onclick = () => selectArea(res.dependencia);
            grid.appendChild(card);
          });
        }).buscarDependencias(query);
      }, 300);
    }

    function selectArea(areaName) {
      setScript('TRANSFERENCIA', areaName);
      // Limpiar búsqueda para foco en el script
      document.getElementById('search-input').value = '';
      document.getElementById('results-grid').innerHTML = '';
    }
  </script>
</body>
</html>
