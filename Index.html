<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRA TU PQRSF REALIZADO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #312B50;
      --secondary: #BEDC16;
      --text-dark: #333;
      --text-light: #fff;
      --bg-gradient: linear-gradient(135deg, #312B50 0%, #4a417a 100%);
      --glass: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-dark);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      perspective: 1000px;
    }

    .card {
      background: var(--glass);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      position: relative;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .header {
      background: var(--primary);
      color: var(--text-light);
      padding: 30px 20px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .header .company {
      font-size: 14px;
      font-weight: 500;
      color: var(--secondary);
    }

    .header .author {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 5px;
    }

    .accent-bar {
      height: 5px;
      background: var(--secondary);
    }

    .content {
      padding: 30px;
    }

    .welcome-text {
      text-align: center;
      margin-bottom: 25px;
      animation: fadeIn 0.8s ease-in;
    }

    .welcome-text h2 {
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e1e1;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: white;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(49, 43, 80, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    button:hover {
      background: #3d3564;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(49, 43, 80, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    .logout-btn {
      background: #f8f9fa;
      color: #dc3545;
      border: 1px solid #ffccd5;
      padding: 8px 15px;
      font-size: 12px;
      margin-top: 20px;
      width: auto;
      margin-left: auto;
      margin-right: auto;
    }

    .logout-btn:hover {
      background: #fff5f5;
      box-shadow: none;
    }

    /* SEARCHABLE DROPDOWN */
    .search-box {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      border: 1px solid #eee;
      margin-top: 5px;
    }

    .search-results div {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .search-results div:hover {
      background: #f0f4f8;
      color: var(--primary);
      font-weight: 500;
    }

    /* LOADER */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: white;
      padding: 12px 25px;
      border-radius: 50px;
      font-size: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      font-size: 18px;
    }

    /* HIDDEN CLASS */
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="card">
    <div class="header">
      <h1>Bienvenido</h1>
      <p class="company">People BPO</p>
      <p class="author">By Duvan Ramos</p>
    </div>
    <div class="accent-bar"></div>
    <div class="content">
      <div class="welcome-text">
        <h2>Inicia Sesión</h2>
        <p style="font-size: 13px; color: #666;">Selecciona tu nombre para continuar</p>
      </div>

      <div class="form-group">
        <label>Asesor</label>
        <select id="login-agente">
          <option value="">Seleccione su nombre</option>
          <option>Angi Johana Banda Montes</option>
          <option>Slendy Lizzeth Pico Garcia</option>
          <option>Heillen Tatiana Rincón Lizarazo</option>
          <option>Juliana Roa Aragonez</option>
          <option>Stefania Ortega Rodríguez</option>
          <option>Hadisha Faride Bitar Lerech</option>
          <option>Bleidis Farides Cabarcas Charris</option>
          <option>Katherine Sofia Nieto Guerra</option>
        </select>
      </div>

      <button onclick="login()">Ingresar</button>
    </div>
  </div>

  <!-- MAIN FORM SCREEN -->
  <div id="form-screen" class="card hidden">
    <div class="header">
      <h1 id="user-greeting">Hola, Asesor</h1>
      <p class="company">People BPO</p>
      <p class="author">By Duvan Ramos</p>
    </div>
    <div class="accent-bar"></div>
    <div class="content">
      <div class="form-group">
        <label>Número de radicado (PQRSF)</label>
        <input id="radicado" type="text" placeholder="Ingrese el radicado">
      </div>

      <div class="form-group">
        <label>Caso</label>
        <input id="caso" type="text" placeholder="Descripción breve del caso">
      </div>

      <div class="form-group">
        <label>Clasificación</label>
        <div class="search-box">
          <input id="clasificacion" onkeyup="filterList('clasificacion', 'list-clasificacion')" placeholder="Buscar clasificación..." autocomplete="off">
          <div id="list-clasificacion" class="search-results"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Se dirige a</label>
        <div class="search-box">
          <input id="dirige" onkeyup="filterList('dirige', 'list-dirige')" placeholder="Buscar área..." autocomplete="off">
          <div id="list-dirige" class="search-results"></div>
        </div>
      </div>

      <button id="submit-btn" onclick="registrar()">
        <span id="btn-text">Registrar PQRSF</span>
        <div id="btn-spinner" class="spinner"></div>
      </button>

      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </div>
</div>

<div id="toast">
  <span id="toast-icon" class="toast-icon"></span>
  <span id="toast-message"></span>
</div>

<script>
  const CLASIFICACIONES = [
    "(Felicitaciones) - FELICITACIONES",
    "(Solicitudes, sugerencias y peticiones) - PETICIÓN O SOLICITUD",
    "(Quejas, reclamos, denuncias) - QUEJA",
    "(Quejas, reclamos, denuncias) - RECLAMO CUOTA MONETARIA Y/O REACTIVACIÓN",
    "(Quejas, reclamos, denuncias) - RECLAMO PROTECCIÓN DE DATOS",
    "(Quejas, reclamos, denuncias) - SOLICITUD DE RESARCIMIENTO",
    "(Solicitudes, sugerencias y peticiones) - SUGERENCIA"
  ];

  const AREAS = [
    "COLEGIO SAN MARTIN", "COLEGIO VILLAVICENCIO", "CONSEJO DIRECTIVO", "CONTABILIDAD GENERAL",
    "COORDINACION DE AFILIACIONES", "COORDINACION DE GESTION DOCUMENTAL", "COORDINACIÓN COMERCIAL",
    "COORDINACIÓN DE MERCADEO", "DIRECCION ADMINISTRATIVA", "DIVISION COMERCIAL Y DE MERCADEO",
    "DIVISION DE APORTES", "DIVISION DE CAPACITACIÓN EMPRESARIAL", "DIVISION DE RECREACION, DEPORTE Y TURISMO",
    "DIVISION DE SUBSIDIOS", "DIVISION DE TECNOLOGIAS DE LA INFORMACIÓN", "DIVISION DE TESORERIA",
    "DIVISIÓN DE ATENCIÓN A LA NIÑEZ", "DIVISIÓN DE GESTIÓN DE EMPLEO", "AREA DE PUBLICIDAD",
    "AREA DE CARTERA", "AREA DE CREDITO COFREM", "AREA DE CULTURA Y EVENTOS", "AREA DE MANTENIMIENTO",
    "AREA INFRAESTRUCTURA", "ASESORIA JURIDICA", "AUDITORIA INTERNA", "BIBLIOTECA",
    "CENTRO DE SERVICIOS PUERTO GAITAN", "CENTRO VACACIONAL CANEY", "CENTRO VACACIONAL YURIMENA",
    "CER", "COLEGIO ACACÍAS", "COLEGIO GUAMAL", "COLEGIO PUERTO LOPEZ", "COLEGIO RESTREPO",
    "DIVISIÓN DE GESTIÓN DE SIST. CORPORATIVO", "DIVISIÓN DE GESTIÓN HUMANA", "DIVISIÓN DE LOGISTICA",
    "EDUCACION SUPERIOR", "FEDECAJAS", "INSTITUTO TECNICO COFREM", "MESA DE SERVICIOS", "NO DEFINIDA",
    "OFICINA MOVIL RUBIALES", "PARQUE DE LA VIDA VILLAVICENCIO", "PARQUE VACACIONAL ARIARI",
    "PLANEACIÓN CORPORATIVA", "PUNTO DE INFORMACIÓN", "SERVICIO AL CLIENTE",
    "SUBDIRECCION ADMINISTRATIVA Y FINANCIERA", "SUBDIRECCION DE PROGRAMAS SOCIALES",
    "SUBDIRECCION DE SERVICIOS SOCIALES", "SUBDIRECCIÓN EDUCACIÓN", "TURISMO SOCIAL",
    "ZONA CENTRO", "ZONA NORTE", "ZONA ORIENTE", "ZONA SUR", "ÁREA DE VIVIENDA"
  ];

  let currentAgent = "";

  window.onload = function() {
    const savedAgent = localStorage.getItem('pqrsf_agent');
    if (savedAgent) {
      showForm(savedAgent);
    }

    // Initialize lists
    populateList('list-clasificacion', CLASIFICACIONES, 'clasificacion');
    populateList('list-dirige', AREAS, 'dirige');

    // Close lists when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-box')) {
        document.querySelectorAll('.search-results').forEach(el => el.style.display = 'none');
      }
    });
  };

  function populateList(listId, data, inputId) {
    const list = document.getElementById(listId);
    list.innerHTML = "";
    data.forEach(item => {
      const div = document.createElement('div');
      div.textContent = item;
      div.onclick = function() {
        document.getElementById(inputId).value = item;
        list.style.display = 'none';
      };
      list.appendChild(div);
    });
  }

  function filterList(inputId, listId) {
    const input = document.getElementById(inputId);
    const filter = input.value.toLowerCase();
    const list = document.getElementById(listId);
    const items = list.getElementsByTagName('div');
    let hasResults = false;

    if (filter === "") {
      list.style.display = 'none';
      return;
    }

    for (let i = 0; i < items.length; i++) {
      const txtValue = items[i].textContent || items[i].innerText;
      if (txtValue.toLowerCase().indexOf(filter) > -1) {
        items[i].style.display = "";
        hasResults = true;
      } else {
        items[i].style.display = "none";
      }
    }
    list.style.display = hasResults ? 'block' : 'none';
  }

  function login() {
    const agente = document.getElementById('login-agente').value;
    if (!agente) {
      showToast('⚠️ Por favor selecciona tu nombre', 'error');
      return;
    }
    localStorage.setItem('pqrsf_agent', agente);
    showForm(agente);
  }

  function logout() {
    localStorage.removeItem('pqrsf_agent');
    document.getElementById('form-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-agente').value = "";
  }

  function showForm(agente) {
    currentAgent = agente;
    document.getElementById('user-greeting').textContent = 'Hola, ' + agente.split(' ')[0];
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('form-screen').classList.remove('hidden');
  }

  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toast-icon');
    const msg = document.getElementById('toast-message');

    icon.textContent = type === 'success' ? '✅' : '❌';
    msg.textContent = message;

    toast.className = 'show';
    setTimeout(() => {
      toast.className = '';
    }, 4000);
  }

  function registrar() {
    const radicado = document.getElementById('radicado').value;
    const caso = document.getElementById('caso').value;
    const clasificacion = document.getElementById('clasificacion').value;
    const dirige = document.getElementById('dirige').value;

    if (!radicado || !caso || !clasificacion || !dirige) {
      showToast('⚠️ Completa todos los campos', 'error');
      return;
    }

    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('btn-spinner');

    btn.disabled = true;
    btnText.style.opacity = '0.5';
    spinner.style.display = 'block';

    const data = {
      agente: currentAgent,
      radicado: radicado,
      caso: caso,
      clasificacion: clasificacion,
      dirige: dirige
    };

    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false;
      btnText.style.opacity = '1';
      spinner.style.display = 'none';

      if (res.estado === "ok") {
        showToast('✨ Registro exitoso');
        document.getElementById('radicado').value = "";
        document.getElementById('caso').value = "";
        document.getElementById('clasificacion').value = "";
        document.getElementById('dirige').value = "";
      } else if (res.estado === "duplicado") {
        showToast('⚠️ Duplicado: ya registrado por ' + res.agente, 'error');
      } else {
        showToast('❌ Error al registrar', 'error');
      }
    }).withFailureHandler(function() {
      btn.disabled = false;
      btnText.style.opacity = '1';
      spinner.style.display = 'none';
      showToast('❌ Error de conexión', 'error');
    }).guardarPQRSF(data);
  }
</script>

</body>
</html>
