<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Du Hub | Operativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090b;
      --sidebar-bg: #0f0f11;
      --card-bg: #18181b;
      --border-color: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #ffffff;
      --accent-hover: #e4e4e7;
      --error: #ef4444;
      --success: #22c55e;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    /* Transition classes */
    .fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #app-container {
      height: 100%;
      width: 100%;
    }

    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p style="font-size: 14px; color: var(--text-muted); font-weight: 500;">Cargando Du Hub...</p>
  </div>

  <div id="app-container">
    <div id="login-view" class="hidden">
      <?!= include('login'); ?>
    </div>
    <div id="dashboard-view" class="hidden">
      <?!= include('dashboard'); ?>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      checkSession();
    });

    function checkSession() {
      const user = sessionStorage.getItem('hub_user');
      if (user) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('login-view').classList.add('fade-in');
    }

    function showDashboard() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      document.getElementById('dashboard-view').classList.add('fade-in');

      // Initialize dashboard data
      if (window.initDashboard) {
        window.initDashboard();
      }
    }

    function logout() {
      sessionStorage.removeItem('hub_user');
      sessionStorage.removeItem('hub_name');
      window.location.reload();
    }
  </script>
</body>
</html>
