<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro - People BPO</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <style>
        :root {
            --primary: #B7D400;
            --primary-dark: #96af00;
            --bg-dark: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0c0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #6c63ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #2c2c54, #1a1a2e);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .bg-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.1;
            z-index: -1;
            border-radius: 50%;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 1;
        }

        .dashboard-container {
            max-width: 1200px;
            width: 95%;
            margin: 40px auto;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .header { text-align: center; margin-bottom: 30px; }
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline { color: var(--text-dim); font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }

        .input-group { margin-bottom: 20px; }
        select, input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            margin-top: 10px;
        }
        select option { background: #1a1a2e; color: white; }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #1a1a2e;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -5px rgba(183, 212, 0, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); background: var(--primary-dark); }

        .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 18px;
            text-align: center;
        }
        .metric-title { color: var(--text-dim); font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 32px; font-weight: 700; color: white; }

        .progress-section { margin: 40px 0; text-align: center; }
        .progress-label { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }
        .progress-track { width: 100%; height: 12px; background: rgba(0,0,0,0.3); border-radius: 100px; border: 1px solid var(--glass-border); position: relative; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #dfff00); border-radius: 100px; transition: width 1.5s ease-out; }

        .bono-tooltip {
            position: absolute; background: white; color: #1a1a2e; padding: 10px; border-radius: 8px; font-size: 12px;
            display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; margin-top: 40px; }
        .chart-box { background: rgba(0,0,0,0.2); padding: 24px; border-radius: 20px; border: 1px solid var(--glass-border); }

        .table-container { margin-top: 40px; overflow-x: auto; border-radius: 20px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.05); padding: 15px; text-align: left; font-size: 12px; color: var(--text-dim); }
        td { padding: 12px 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .logout-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
        .footer { text-align: center; margin-top: 20px; font-size: 10px; color: var(--text-dim); opacity: 0.5; }

        #loader { position: fixed; inset: 0; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(183, 212, 0, 0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) { .charts-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="bg-blob" style="top: -10%; right: -10%;"></div>
    <div class="bg-blob" style="bottom: -10%; left: -10%; background: #00d2ff;"></div>

    <div id="loader" style="display:none">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-size: 14px; color: white;">SINCRONIZANDO DATOS...</p>
    </div>

    <div id="tooltipBono" class="bono-tooltip"></div>

    <div class="container" id="loginSection">
        <div class="glass-card login-card">
            <div class="header">
                <h1 class="logo-text">Desempeño</h1>
                <p class="tagline">People BPO</p>
            </div>
            <div class="input-group">
                <label style="font-size: 12px; color: var(--text-dim);">SELECCIONAR USUARIO</label>
                <select id="usuario"></select>
            </div>
            <div class="input-group">
                <label style="font-size: 12px; color: var(--text-dim);">CONTRASEÑA</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">INGRESAR AL PANEL</button>
            <p class="footer">BY DUVAN RAMOS 2026 • v2.1 PRO</p>
        </div>
    </div>

    <div class="dashboard-container" id="dashboardSection" style="display:none">
        <div class="glass-card">
            <button class="logout-btn" onclick="logout()">SALIR</button>
            <div class="header" style="text-align: left;">
                <h1 class="logo-text" id="asesorNombre">Nombre Asesor</h1>
                <p class="tagline">Panel de Rendimiento Individual</p>
            </div>

            <div class="metric-grid">
                <div class="metric-card"><div class="metric-title" id="lblPec">PEC</div><div class="metric-value" id="valPec">0%</div></div>
                <div class="metric-card"><div class="metric-title" id="lblPenc">PENC</div><div class="metric-value" id="valPenc">0%</div></div>
                <div class="metric-card" id="boxRanking"><div class="metric-title" id="lblRanking">RANKING</div><div class="metric-value" id="valRanking">#0</div></div>
                <div class="metric-card" id="boxAuditorias"><div class="metric-title" id="lblAuditorias">AUDITORÍAS</div><div class="metric-value" id="valAuditorias">0</div></div>
                <div class="metric-card" id="boxPqrsfC"><div class="metric-title" id="lblPqrsfC">PQRSF CREADOS</div><div class="metric-value" id="valPqrsfC">0</div></div>
                <div class="metric-card" id="boxPqrsfD"><div class="metric-title" id="lblPqrsfD">PQRSF DEVUELTOS</div><div class="metric-value" id="valPqrsfD">0</div></div>
            </div>

            <div class="progress-section">
                <div class="progress-label" id="labelEstado">Cargando...</div>
                <div class="progress-track"><div class="progress-fill" id="barraProgreso"></div></div>
            </div>

            <div class="charts-row">
                <div class="chart-box"><canvas id="chartMain"></canvas></div>
                <div class="chart-box" id="chartPqrsfBox"><canvas id="chartPqrsf"></canvas></div>
            </div>

            <div class="table-container" id="tableBox" style="display:none">
                <table>
                    <thead><tr><th>Fecha</th><th>Fortalezas</th><th>Mejoras</th><th>Grabación</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <p class="footer" style="margin-top:40px">BY DUVAN RAMOS 2026 • v2.1 PRO</p>
        </div>
    </div>

    <script>
        let mainChart, pqrsfChart;
        const ASESORES_ESP = ["J.MENDOZA382", "L.BUITRAGO104", "M.ARAGONES300"];
        const ASESORES_REND = ["DEISY.ROMERO", "LISANDRO.GUTIERREZ", "PAULAISABEL.ABELLAESPINOSA", "FRANCY.HERNANDEZ", "CESAR.RIVAS", "MONICA.RUIZ"];

        window.onload = () => {
            showLoader(true);
            google.script.run
                .withSuccessHandler(list => {
                    const select = document.getElementById('usuario');
                    list.forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u; opt.text = u;
                        select.appendChild(opt);
                    });
                    showLoader(false);
                })
                .withFailureHandler(() => { alert("Error al cargar usuarios"); showLoader(false); })
                .obtenerUsuarios();
        };

        function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

        function logout() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('password').value = '';
        }

        function login() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            showLoader(true);
            google.script.run
                .withSuccessHandler(res => {
                    showLoader(false);
                    if (res === "ERROR") { alert("Contraseña Incorrecta"); return; }
                    renderDashboard(user, res);
                })
                .withFailureHandler(() => { alert("Error de conexión"); showLoader(false); })
                .login(user, pass);
        }

        function resetDashboardUI() {
            const ids = ['lblPec','lblPenc','lblRanking','lblAuditorias','lblPqrsfC','lblPqrsfD'];
            const labels = ['PEC','PENC','RANKING','AUDITORÍAS','PQRSF CREADOS','PQRSF DEVUELTOS'];
            ids.forEach((id, i) => document.getElementById(id).innerText = labels[i]);
            ['boxRanking','boxAuditorias','boxPqrsfC','boxPqrsfD','chartPqrsfBox'].forEach(id => document.getElementById(id).style.display = 'block');
        }

        function renderDashboard(user, data) {
            resetDashboardUI();
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('asesorNombre').innerText = data.nombre;

            const isEsp = ASESORES_ESP.indexOf(user) !== -1;
            const isRend = ASESORES_REND.indexOf(user) !== -1;

            if (isEsp) {
                document.getElementById('lblPec').innerText = 'SNC RECIBIDOS';
                document.getElementById('lblPenc').innerText = 'CANTIDAD RADICADO';
                document.getElementById('lblRanking').innerText = 'RANKING SNC';
                document.getElementById('lblPqrsfC').innerText = 'POR CORRECCIÓN';
                document.getElementById('lblPqrsfD').innerText = 'SNC SOLUCIONADO';
                document.getElementById('valPec').innerText = data.sncRecibidos;
                document.getElementById('valPenc').innerText = data.pqrsfCreados;
                document.getElementById('valRanking').innerText = "#" + data.rankingSNC;
                document.getElementById('valPqrsfC').innerText = data.pqrsfDevueltos;
                document.getElementById('valPqrsfD').innerText = data.sncSolucionado;
                document.getElementById('boxAuditorias').style.display = 'none';
            } else {
                document.getElementById('valPec').innerText = (data.pec * 100).toFixed(0) + "%";
                document.getElementById('valPenc').innerText = (data.penc * 100).toFixed(1) + "%";
                document.getElementById('valRanking').innerText = "#" + data.ranking;
                document.getElementById('valAuditorias').innerText = data.auditorias;
                document.getElementById('valPqrsfC').innerText = data.pqrsfCreados;
                document.getElementById('valPqrsfD').innerText = data.pqrsfDevueltos;
                if (isRend) {
                    ['boxRanking','boxAuditorias','boxPqrsfC','boxPqrsfD','chartPqrsfBox'].forEach(id => document.getElementById(id).style.display = 'none');
                }
            }

            renderCharts(user, data, isEsp, isRend);
            renderTable(data.tablaData);
            updateProgressBar(user, data, isRend);
        }

        function updateProgressBar(user, d, isRend) {
            const bar = document.getElementById('barraProgreso');
            const label = document.getElementById('labelEstado');
            const track = document.querySelector('.progress-track');
            const tooltip = document.getElementById('tooltipBono');
            track.onmousemove = null; track.onmouseleave = null;

            if (isRend) {
                const pec = d.pec * 100;
                let text = "🔴 NIVEL SEGUIMIENTO", col = "#ff4d4d";
                if(pec >= 90) { text = "🟢 NIVEL EXCELENTE"; col = "#B7D400"; }
                else if(pec >= 80) { text = "🟡 NIVEL POR MEJORAR"; col = "#ffd700"; }
                label.innerText = text + " (" + pec.toFixed(1) + "%)";
                bar.style.width = Math.min(pec, 100) + "%";
                bar.style.background = col;
            } else {
                const max = 300000;
                const ganado = d.bonoGanado || 0;
                const pct = (ganado / max) * 100;
                const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits:0 });
                label.innerText = "BONO: " + fmt.format(ganado) + " / " + fmt.format(max);
                bar.style.width = Math.min(pct, 100) + "%";
                bar.style.background = "linear-gradient(90deg, #B7D400, #fff)";

                track.onmousemove = function(e) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.pageX + 15) + 'px';
                    tooltip.style.top = (e.pageY + 15) + 'px';
                    tooltip.innerHTML = "<strong>Faltan " + fmt.format(max - ganado) + "</strong> para el máximo.";
                };
                track.onmouseleave = function() { tooltip.style.display = 'none'; };
            }
        }

        function renderCharts(user, d, isEsp, isRend) {
            if (mainChart) mainChart.destroy();
            if (pqrsfChart) pqrsfChart.destroy();

            const ctx1 = document.getElementById('chartMain').getContext('2d');
            mainChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: isEsp ? ["SNC Recibidos", "Cantidad Radicado"] : ["PEC %", "PENC %"],
                    datasets: [{
                        data: isEsp ? [d.sncRecibidos, d.pqrsfCreados] : [d.pec*100, d.penc*100],
                        backgroundColor: ['#B7D400', 'rgba(255,255,255,0.1)'],
                        borderRadius: 10
                    }]
                },
                plugins: [ChartDataLabels],
                options: {
                    responsive: true,
                    plugins: { legend: { display: false }, datalabels: { color: '#fff', formatter: v => isEsp ? v : v.toFixed(1)+'%' } },
                    scales: { y: { beginAtZero: true, max: isEsp ? null : 100 } }
                }
            });

            if (!isRend) {
                const ctx2 = document.getElementById('chartPqrsf').getContext('2d');
                pqrsfChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: ["Creados", "Devueltos"],
                        datasets: [{ data: [d.pqrsfCreados, d.pqrsfDevueltos], backgroundColor: ['#6c63ff', '#ff4d4d'], borderRadius: 10 }]
                    },
                    plugins: [ChartDataLabels],
                    options: { responsive: true, plugins: { legend: { display: false }, datalabels: { color: '#fff' } } }
                });
            }
        }

        function renderTable(data) {
            const box = document.getElementById('tableBox');
            const body = document.getElementById('tableBody');
            body.innerHTML = "";
            if (data && data.length > 0) {
                box.style.display = "block";
                data.forEach(f => {
                    const tr = document.createElement('tr');
                    const link = f.link && f.link.toString().startsWith('http') ? '<a href="'+f.link+'" target="_blank" style="color:#B7D400">ESCUCHAR</a>' : 'N/A';
                    tr.innerHTML = '<td>'+(f.fecha||'-')+'</td><td>'+(f.positivos||'-')+'</td><td>'+(f.mejora||'-')+'</td><td>'+link+'</td>';
                    body.appendChild(tr);
                });
            } else { box.style.display = "none"; }
        }
    </script>
</body>
</html>
