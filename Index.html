<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TMO Alertas - Real-Time Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* LOGIN STYLES */
    #login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .login-card h2 {
      color: var(--primary);
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: #052e16;
      border: none;
      border-radius: 0.5rem;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      animation: pulse-button 2s infinite;
    }

    @keyframes pulse-button {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .btn-login:hover {
      background: #4ade80;
      transform: translateY(-2px);
    }

    /* DASHBOARD STYLES */
    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-content h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-content p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      background: rgba(34, 197, 94, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      color: var(--primary);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    main {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      flex: 1;
    }

    #contenedor {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .agente-name {
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--text-main);
    }

    .badge-demora {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .info-row strong {
      color: var(--primary);
    }

    .actions {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-msg {
      background: var(--primary);
      color: #052e16;
    }

    .btn-msg:hover {
      background: #4ade80;
    }

    .btn-num {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-num:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 4rem 0;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state h2 {
      font-weight: 400;
      font-size: 1.25rem;
    }

    /* Toast notification styles */
    #toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 10000;
    }

    .toast {
      background: #1e293b;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      margin-top: 0.5rem;
      border-left: 4px solid var(--primary);
      animation: toastIn 0.3s ease-out;
    }

    @keyframes toastIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Persistent Alert Modal */
    #alert-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(239, 68, 68, 0.9);
      backdrop-filter: blur(8px);
      z-index: 9000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      color: white;
      padding: 2rem;
    }

    .modal-content {
      background: #1e293b;
      padding: 3rem;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 4px solid var(--danger);
      max-width: 600px;
      animation: modalShake 0.5s infinite;
    }

    @keyframes modalShake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    .modal-content h2 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      color: var(--danger);
    }

    .modal-content p {
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }

    .btn-dismiss {
      padding: 1.5rem 3rem;
      font-size: 1.5rem;
      background: var(--danger);
      color: white;
      border-radius: 1rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: transform 0.2s;
    }

    .btn-dismiss:hover {
      transform: scale(1.1);
      background: #ff0000;
    }

    /* LOADER */
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8); display: none; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10001; color: white; backdrop-filter: blur(4px);
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div id="loader"><div class="spinner"></div><div>Procesando...</div></div>

  <!-- LOGIN SECTION -->
  <div id="login-container">
    <div class="login-card">
      <h2>🚀 TMO Alertas</h2>
      <p>People BPO Monitor</p>
      <div class="input-group">
        <label for="user">Usuario</label>
        <input type="text" id="user" placeholder="Ingresa tu usuario">
      </div>
      <div class="input-group">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <button class="btn-login" onclick="login()">INGRESAR AL DASHBOARD 🔔</button>
      <p style="margin-top: 1.5rem; font-size: 0.75rem;">By Duvan Ramos</p>
    </div>
  </div>

  <!-- DASHBOARD SECTION (Hidden initially) -->
  <div id="dashboard-container" style="display: none;">
    <header>
      <div class="header-content">
        <h1>🚨 TMO ALERTA</h1>
        <p>People BPO Monitor • By Duvan Ramos</p>
      </div>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="btn-num" onclick="logout()" style="padding: 0.5rem 1rem; font-size: 0.75rem;">Cerrar Sesión</button>
        <div class="status-indicator">
          <div class="pulse"></div>
          En vivo
        </div>
      </div>
    </header>

    <main>
      <div id="contenedor">
        <div class="empty-state">
          <h2>Iniciando monitoreo...</h2>
        </div>
      </div>
    </main>
  </div>

  <div id="alert-modal">
    <div class="modal-content">
      <h2>🚨 ALERTA 🚨</h2>
      <p id="modal-text">Hay una nueva demora detectada.</p>
      <button class="btn-dismiss" onclick="dismissAlert()">ENTENDIDO / GESTIONAR ✅</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Sonido de notificación -->
  <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto" loop></audio>

  <script>
    let seenAlerts = new Set();
    let isInitialLoad = true;
    let audioEnabled = false;
    let pollingInterval = null;

    function login() {
      const user = document.getElementById('user').value;
      const pass = document.getElementById('pass').value;

      if (!user || !pass) {
        showToast("⚠️ Ingresa credenciales");
        return;
      }

      // 🔊 PRIME AUDIO IMMEDIATELY (must be synchronous to user click)
      const sound = document.getElementById('notif-sound');
      sound.volume = 1.0;
      const primePromise = sound.play();

      if (primePromise !== undefined) {
        primePromise.then(() => {
          sound.pause();
          sound.currentTime = 0;
          audioEnabled = true;
          console.log("Audio primed successfully");
        }).catch(e => {
          console.error("Audio priming failed:", e);
          // We don't block login, but we mark it as potentially failed
        });
      }

      document.getElementById('loader').style.display = 'flex';

      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('loader').style.display = 'none';
          if (res.success) {
            // Switch view
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'block';

            // Start monitoring
            updateDashboard();
            pollingInterval = setInterval(updateDashboard, 5000);
            showToast("✅ Sesión iniciada con éxito");
          } else {
            showToast("❌ Credenciales incorrectas");
          }
        })
        .withFailureHandler(err => {
          document.getElementById('loader').style.display = 'none';
          showToast("❌ Error de conexión");
        })
        .validarLogin(user, pass);
    }

    function formatTiempo(tiempoStr) {
      const match = tiempoStr.match(/(\d{2}):(\d{2}):(\d{2})/);
      if (match) {
        const hh = parseInt(match[1]);
        const mm = parseInt(match[2]);
        const ss = match[3];
        let totalMinutes = hh * 60 + mm;
        return `${totalMinutes}:${ss} Minutos`;
      }
      return tiempoStr;
    }

    function createCard(alert) {
      const tiempoFormatted = formatTiempo(alert.tiempo);
      const mensaje = `Hola *${alert.agente}* 👋\n\n⏰ *Minutos en gestión* ${tiempoFormatted}\nDe esta llamada o chat actual, evitemos demoras, por favor vez gestionando el cierre de la interacción con el usuario.\n\n_Mensaje automático 🤖_`;

      return `
        <div class="card" id="alert-${alert.id}">
          <div class="card-header">
            <span class="agente-name">${alert.agente}</span>
            <span class="badge-demora">DEMORA</span>
          </div>
          <div class="info-row">
            <span>⏱️ Tiempo:</span>
            <strong>${tiempoFormatted}</strong>
          </div>
          <div class="info-row">
            <span>📱 WhatsApp:</span>
            <span>${alert.whatsapp}</span>
          </div>
          <div class="actions">
            <button class="btn-msg" onclick="copiarTexto(\`${mensaje.replace(/\n/g, '\\n')}\`, 'Mensaje')">
              📋 Copiar Msg
            </button>
            <button class="btn-num" onclick="copiarTexto('${alert.whatsapp}', 'Número')">
              📱 Copiar Núm
            </button>
          </div>
        </div>
      `;
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    }

    function copiarTexto(texto, tipo) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(() => {
          showToast(tipo + " copiado con éxito ✅");
        }).catch(err => {
          console.error('Error al copiar: ', err);
        });
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = texto;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(tipo + " copiado (fallback) ✅");
        } catch (err) {
          showToast("Error al copiar ❌");
        }
        document.body.removeChild(textArea);
      }
    }

    function updateDashboard() {
      google.script.run
        .withSuccessHandler(data => {
          const container = document.getElementById('contenedor');

          if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state"><h2>No hay demoras activas en este momento.</h2><p>Todo está bajo control.</p></div>';
            seenAlerts.clear();
            return;
          }

          let newAlertDetected = false;
          let lastAgent = "";
          let currentIds = new Set();

          let html = '';
          data.forEach(alert => {
            const alertKey = `${alert.agente}-${alert.id}`;
            currentIds.add(alertKey);

            if (!seenAlerts.has(alertKey)) {
              newAlertDetected = true;
              lastAgent = alert.agente;
              seenAlerts.add(alertKey);
            }

            html += createCard(alert);
          });

          container.innerHTML = html;

          if (newAlertDetected) {
            triggerAlert(lastAgent);
          }

          for (let key of seenAlerts) {
            if (!currentIds.has(key)) {
              seenAlerts.delete(key);
            }
          }

          isInitialLoad = false;
        })
        .withFailureHandler(err => {
          console.error("Error fetching data:", err);
        })
        .obtenerAlertas();
    }

    function triggerAlert(agente) {
      const modal = document.getElementById('alert-modal');
      const modalText = document.getElementById('modal-text');
      const sound = document.getElementById('notif-sound');

      modalText.textContent = `Nueva demora detectada: ${agente}`;
      modal.style.display = 'flex';

      // Attempt to play sound regardless of audioEnabled flag (as a fallback)
      sound.currentTime = 0;
      sound.volume = 1.0;
      const playPromise = sound.play();

      if (playPromise !== undefined) {
        playPromise.catch(e => {
          console.warn("Sound play blocked by browser:", e);
          showToast("🔊 Haz clic en la pantalla para activar sonido");
        });
      }

      showToast("⚠️ Nueva alerta de demora detectada");
    }

    function dismissAlert() {
      const modal = document.getElementById('alert-modal');
      const sound = document.getElementById('notif-sound');

      modal.style.display = 'none';
      sound.pause();
      sound.currentTime = 0;
    }

    function logout() {
      if (pollingInterval) clearInterval(pollingInterval);
      seenAlerts.clear();
      isInitialLoad = true;
      document.getElementById('dashboard-container').style.display = 'none';
      document.getElementById('login-container').style.display = 'flex';
      document.getElementById('pass').value = '';
      showToast("🚪 Sesión cerrada");
    }
  </script>
</body>
</html>
