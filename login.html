<style>
  .login-container {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at top center, #18181b 0%, #09090b 100%);
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }

  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-text {
    font-family: 'Poppins', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-main);
    margin-bottom: 8px;
    display: block;
  }

  .login-subtitle {
    font-size: 14px;
    color: var(--text-muted);
  }

  .input-group {
    margin-bottom: 20px;
  }

  .input-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper input {
    width: 100%;
    background: #09090b;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text-main);
    font-family: var(--font-main);
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .input-wrapper input:focus {
    outline: none;
    border-color: var(--text-muted);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
  }

  .btn-login {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-login:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  .btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .error-message {
    font-size: 13px;
    color: var(--error);
    background: rgba(239, 68, 68, 0.1);
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 20px;
    display: none;
    text-align: center;
  }

  .login-footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .login-footer span {
    color: var(--text-main);
    font-weight: 500;
  }
</style>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <span class="logo-text">Du Hub</span>
      <p class="login-subtitle">Gestión operativa People BPO</p>
    </div>

    <div id="login-error" class="error-message"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <input type="text" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn-login">
        <span>Ingresar al Sistema</span>
      </button>
    </form>

    <div class="login-footer">
      <p>People BPO — By <span>Duvan Ramos</span> 2026</p>
    </div>
  </div>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();

    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('login-error');

    // UI State: Loading
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px; height:16px; margin-bottom:0; border-width:2px;"></div>';
    errorDiv.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          sessionStorage.setItem('hub_user', response.usuario);
          sessionStorage.setItem('hub_name', response.nombre);
          showDashboard();
        } else {
          showError(response.message || 'Error de autenticación');
          resetBtn();
        }
      })
      .withFailureHandler(function(err) {
        showError('Error de conexión con el servidor');
        resetBtn();
      })
      .validarLogin(user, pass);
  }

  function showError(msg) {
    const errorDiv = document.getElementById('login-error');
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
    errorDiv.classList.add('fade-in');
  }

  function resetBtn() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = false;
    btn.innerHTML = '<span>Ingresar al Sistema</span>';
  }
</script>
