<script>
  let allData = [];
  let filteredData = [];
  let charts = {};
  let currentPage = 1;
  const rowsPerPage = 10;
  let currentSort = { column: null, direction: 'asc' };
  let currentUser = null;

  // Page initialization
  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    checkSession();
    loadLoginUsers();
  });

  function checkSession() {
    const session = localStorage.getItem('pqrsf_session');
    if (session) {
      currentUser = JSON.parse(session);
      showViewByRole(currentUser.role);
    } else {
      showView('loginView');
    }
  }

  function loadLoginUsers() {
    google.script.run
      .withSuccessHandler(users => {
        const select = document.getElementById('agentSelect');
        if (!select) return;
        select.innerHTML = '<option value="" disabled selected>Selecciona tu nombre...</option>';
        users.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.nombre;
          opt.textContent = u.nombre;
          select.appendChild(opt);
        });
      })
      .obtenerUsuarios();
  }

  function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('agentSelect').value;
    const pass = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');

    errorDiv.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Ingresando...';

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          currentUser = res;
          localStorage.setItem('pqrsf_session', JSON.stringify(res));
          showViewByRole(res.role);
        } else {
          errorDiv.textContent = res.message;
          errorDiv.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<span>Ingresar al Sistema</span> <i data-lucide="arrow-right"></i>';
          lucide.createIcons();
        }
      })
      .withFailureHandler(err => {
        errorDiv.textContent = "Error de conexión: " + err.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Ingresar al Sistema</span> <i data-lucide="arrow-right"></i>';
        lucide.createIcons();
      })
      .validarLogin(user, pass);
  }

  function showViewByRole(role) {
    if (role === 'admin') {
      showView('adminView');
      fetchData();
    } else {
      showView('agentView');
      // Initialize Agent view if needed
      if (typeof initAgentPortal === 'function') initAgentPortal();
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view-container').forEach(v => v.style.display = 'none');
    document.getElementById(viewId).style.display = 'block';
    if (viewId === 'loginView') {
      localStorage.removeItem('pqrsf_session');
    }
    lucide.createIcons();
  }

  function handleLogout() {
    localStorage.removeItem('pqrsf_session');
    location.reload();
  }

  // --- Agent Portal Logic ---
  let activeCase = null;
  let gestionesHoy = 0;

  function initAgentPortal() {
    document.getElementById('agentName').textContent = currentUser.nombre;
    updateAgentStats();
  }

  function updateAgentStats() {
    // In a real app, fetch from server. For now, local counter.
    document.getElementById('agentCountToday').textContent = gestionesHoy;
  }

  function claimNextCase() {
    const btn = document.getElementById('btnClaim');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Solicitando...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="grab"></i> Solicitar Radicado';
        lucide.createIcons();

        if (res.success) {
          activeCase = res.data;
          showActiveCase();
        } else {
          alert(res.message);
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="grab"></i> Solicitar Radicado';
        lucide.createIcons();
        alert("Error: " + err.message);
      })
      .claimNextCase(currentUser.nombre);
  }

  function showActiveCase() {
    document.getElementById('claimCaseCard').style.display = 'none';
    document.getElementById('activeCaseCard').style.display = 'block';

    document.getElementById('activeRadicadoLabel').textContent = activeCase.radicado;
    document.getElementById('caseNombre').textContent = activeCase.nombre;
    document.getElementById('caseTelefono').textContent = activeCase.telefono;
    document.getElementById('caseEmpresa').textContent = activeCase.empresa;
    document.getElementById('caseFecha').textContent = activeCase.fecha;

    lucide.createIcons();
  }

  function saveManagement(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSaveMgmt');
    const data = {
      rowId: activeCase.rowId,
      estado: document.getElementById('mgmtEstado').value,
      canal: document.getElementById('mgmtCanal').value,
      efectividad: document.getElementById('mgmtEfectividad').value,
      otraSolucion: document.getElementById('mgmtOtraSolucion').value,
      seEncontro: document.getElementById('mgmtSeEncontro').value,
      observacion: document.getElementById('mgmtObservacion').value
    };

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Guardando...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="save"></i> Guardar Gestión';
        lucide.createIcons();

        if (res.success) {
          gestionesHoy++;
          updateAgentStats();
          resetManagement();
          alert("Gestión guardada con éxito.");
        } else {
          alert("Error: " + res.message);
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="save"></i> Guardar Gestión';
        lucide.createIcons();
        alert("Error de conexión: " + err.message);
      })
      .saveManagement(data);
  }

  function resetManagement() {
    activeCase = null;
    document.getElementById('activeCaseCard').style.display = 'none';
    document.getElementById('claimCaseCard').style.display = 'block';
    document.getElementById('managementForm').reset();
    document.getElementById('aiInput').value = '';
    document.getElementById('aiOutputContainer').style.display = 'none';
  }

  function improveText(tipo) {
    const prompt = document.getElementById('aiInput').value.trim();
    if (!prompt) {
      alert("Por favor ingresa algunas notas para mejorar.");
      return;
    }

    if (!activeCase) {
      alert("Debes tener un caso activo para generar una respuesta.");
      return;
    }

    const outputContainer = document.getElementById('aiOutputContainer');
    const outputBox = document.getElementById('aiOutput');

    outputContainer.style.display = 'block';
    outputBox.innerHTML = '<span class="spinner-sm" style="border-top-color:var(--primary)"></span> Procesando con IA...';

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          outputBox.textContent = res.text;
        } else {
          outputBox.textContent = "Error: " + res.message;
        }
      })
      .withFailureHandler(err => {
        outputBox.textContent = "Error de servidor: " + err.message;
      })
      .generarRespuestaIA(prompt, tipo, activeCase);
  }

  function copyToClipboard() {
    const text = document.getElementById('aiOutput').textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert("Copiado al portapapeles");
    });
  }

  function fetchData() {
    toggleLoader(true);
    google.script.run
      .withSuccessHandler(data => {
        allData = data;
        filteredData = [...allData];
        initializeFilters();
        updateDashboard();
        toggleLoader(false);
      })
      .withFailureHandler(err => {
        alert("Error al cargar datos: " + err.message);
        toggleLoader(false);
      })
      .getPQRSFData();
  }

  function toggleLoader(show) {
    document.getElementById('loader').style.display = show ? 'flex' : 'none';
  }

  function initializeFilters() {
    const months = [...new Set(allData.map(d => {
      if(!d.fechaCofrem) return null;
      const date = new Date(d.fechaCofrem);
      return date.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
    }).filter(Boolean))].sort();

    const companies = [...new Set(allData.map(d => d.empresa).filter(Boolean))].sort();
    const channels = [...new Set(allData.map(d => d.canal).filter(Boolean))].sort();
    const statuses = [...new Set(allData.map(d => d.estado).filter(Boolean))].sort();

    populateSelect('filterMonth', months);
    populateSelect('filterCompany', companies);
    populateSelect('filterChannel', channels);
    populateSelect('filterStatus', statuses);
  }

  function populateSelect(id, values) {
    const select = document.getElementById(id);
    const currentValue = select.value;
    select.innerHTML = `<option value="">Todos</option>`;
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v.charAt(0).toUpperCase() + v.slice(1);
      select.appendChild(opt);
    });
    select.value = currentValue;
  }

  function applyFilters() {
    const month = document.getElementById('filterMonth').value;
    const company = document.getElementById('filterCompany').value;
    const channel = document.getElementById('filterChannel').value;
    const status = document.getElementById('filterStatus').value;

    const peopleStart = document.getElementById('filterDatePeopleStart').value;
    const peopleEnd = document.getElementById('filterDatePeopleEnd').value;

    filteredData = allData.filter(d => {
      const dMonth = d.fechaCofrem ? new Date(d.fechaCofrem).toLocaleString('es-ES', { month: 'long', year: 'numeric' }) : null;

      let peopleMatch = true;
      if (d.recibidoPeople) {
        if (peopleStart && d.recibidoPeople < peopleStart) peopleMatch = false;
        if (peopleEnd && d.recibidoPeople > peopleEnd) peopleMatch = false;
      } else if (peopleStart || peopleEnd) {
        peopleMatch = false;
      }

      return (!month || dMonth === month) &&
             peopleMatch &&
             (!company || d.empresa === company) &&
             (!channel || d.canal === channel) &&
             (!status || d.estado === status);
    });

    currentPage = 1;
    updateDashboard();
  }

  function updateDashboard() {
    renderKPIs();
    renderCharts();
    renderTable();
    generateInsights();
  }

  function renderKPIs() {
    const todayStr = new Date().toISOString().split('T')[0];
    const gestionesHoy = filteredData.filter(d => d.isManaged && d.recibidoPeople === todayStr).length;

    const total = filteredData.length;
    const managed = filteredData.filter(d => d.isManaged).length;
    const pending = total - managed;
    const effective = filteredData.filter(d => {
      const val = (d.efectividad || "").toLowerCase().trim();
      return val === 'sí' || val === 'si';
    }).length;

    document.getElementById('kpiToday').textContent = gestionesHoy;
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiManaged').textContent = managed;
    document.getElementById('kpiPending').textContent = pending;

    const managedPerc = total > 0 ? ((managed / total) * 100).toFixed(1) : 0;
    const pendingPerc = total > 0 ? ((pending / total) * 100).toFixed(1) : 0;
    const effectivePerc = total > 0 ? ((effective / total) * 100).toFixed(1) : 0;

    document.getElementById('kpiManagedPerc').textContent = `${managedPerc}% del total`;
    document.getElementById('kpiPendingPerc').textContent = `${pendingPerc}% del total`;
    document.getElementById('kpiEffectiveness').textContent = `${effectivePerc}%`;

    // Secondary metrics
    const contacted = filteredData.filter(d => d.estado === 'Contactado').length;
    const noAnswer = filteredData.filter(d => d.estado === 'No contesta').length;
    const requiresOther = filteredData.filter(d => d.requiereOtraSolucion === 'Sí').length;

    document.getElementById('valContacted').textContent = total > 0 ? ((contacted / total) * 100).toFixed(1) + '%' : '0%';
    document.getElementById('valNoAnswer').textContent = total > 0 ? ((noAnswer / total) * 100).toFixed(1) + '%' : '0%';
    document.getElementById('valRequiresOther').textContent = total > 0 ? ((requiresOther / total) * 100).toFixed(1) + '%' : '0%';
  }

  function renderCharts() {
    // 1. Status Chart
    const statusCounts = countBy(filteredData, 'estado');
    updateChart('chartStatus', 'pie', Object.keys(statusCounts), Object.values(statusCounts), ['#3b3561', '#ef4444', '#facc15', '#64748b'], 'Estados');

    // 2. Channel Chart
    const channelCounts = countBy(filteredData, 'canal');
    updateChart('chartChannel', 'doughnut', Object.keys(channelCounts), Object.values(channelCounts), ['#6366f1', '#b7d400'], 'Canales');

    // 3. Managed vs Pending
    const managedCounts = {
      'Gestionados': filteredData.filter(d => d.isManaged).length,
      'Por Comunicar': filteredData.filter(d => !d.isManaged).length
    };
    updateChart('chartManaged', 'pie', Object.keys(managedCounts), Object.values(managedCounts), ['#22c55e', '#ef4444'], 'Gestión');

    // 4. Effectiveness
    const effCounts = countBy(filteredData, 'efectividad');
    updateChart('chartEffectiveness', 'bar', Object.keys(effCounts), Object.values(effCounts), ['#b7d400', '#f1f5f9'], 'Casos');

    // 5. Trend (By month)
    const trendData = getTrendData(filteredData);
    updateChart('chartTrend', 'line', trendData.labels, trendData.values, ['#3b3561'], 'PQRSF Recibidos');
  }

  function updateChart(id, type, labels, data, colors, datasetLabel = '') {
    if (charts[id]) charts[id].destroy();

    const ctx = document.getElementById(id).getContext('2d');
    charts[id] = new Chart(ctx, {
      type: type,
      data: {
        labels: labels,
        datasets: [{
          label: datasetLabel,
          data: data,
          backgroundColor: colors,
          borderColor: type === 'line' ? colors[0] : '#ffffff',
          tension: 0.3,
          fill: type === 'line' ? 'origin' : false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: type !== 'bar',
            position: 'bottom',
            labels: { boxWidth: 12, font: { size: 10 } }
          },
          datalabels: {
            display: (ctx) => ctx.dataset.data[ctx.dataIndex] > 0,
            color: (ctx) => type === 'bar' ? '#3b3561' : '#fff',
            anchor: (ctx) => type === 'bar' ? 'end' : 'center',
            align: (ctx) => type === 'bar' ? 'top' : 'center',
            offset: 4,
            font: { weight: 'bold', size: 10 },
            formatter: (value, ctx) => {
              let sum = 0;
              let dataArr = ctx.chart.data.datasets[0].data;
              dataArr.map(data => sum += data);
              let percentage = (value * 100 / sum).toFixed(1) + "%";
              return type === 'bar' ? value : percentage;
            }
          }
        },
        scales: type === 'bar' || type === 'line' ? {
          y: {
            beginAtZero: true,
            grid: { display: false },
            ticks: { font: { size: 10 } }
          },
          x: {
            grid: { display: false },
            ticks: {
              font: { size: 10 },
              maxRotation: 45,
              minRotation: 45
            }
          }
        } : {}
      },
      plugins: [ChartDataLabels]
    });
  }

  function countBy(arr, key) {
    return arr.reduce((acc, obj) => {
      const val = obj[key] || 'Sin definir';
      acc[val] = (acc[val] || 0) + 1;
      return acc;
    }, {});
  }

  function getTrendData(data) {
    const sortedData = [...data].filter(d => d.fechaCofrem).sort((a, b) => new Date(a.fechaCofrem) - new Date(b.fechaCofrem));

    const groups = sortedData.reduce((acc, obj) => {
      const date = new Date(obj.fechaCofrem);
      const m = date.toLocaleString('es-ES', { month: 'short', year: '2-digit' });
      acc[m] = (acc[m] || 0) + 1;
      return acc;
    }, {});

    return {
      labels: Object.keys(groups),
      values: Object.values(groups)
    };
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    // Calculate pagination
    const totalRows = filteredData.length;
    const totalPages = Math.ceil(totalRows / rowsPerPage) || 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const startIdx = (currentPage - 1) * rowsPerPage;
    const endIdx = startIdx + rowsPerPage;
    const displayData = filteredData.slice(startIdx, endIdx);

    displayData.forEach(row => {
      const tr = document.createElement('tr');
      const effVal = (row.efectividad || "").toLowerCase().trim();
      const isEffective = effVal === 'sí' || effVal === 'si';

      tr.innerHTML = `
        <td><strong>${row.radicado}</strong></td>
        <td>${row.nombre}</td>
        <td>${row.empresa}</td>
        <td><span class="badge ${getStatusBadge(row.estado)}">${row.estado || '---'}</span></td>
        <td>${row.canal || '---'}</td>
        <td><span class="badge ${isEffective ? 'badge-success' : 'badge-danger'}">${row.efectividad || 'No'}</span></td>
      `;
      tbody.appendChild(tr);
    });

    // Update pagination info
    document.getElementById('paginationInfo').textContent = `Mostrando ${Math.min(startIdx + 1, totalRows)} - ${Math.min(endIdx, totalRows)} de ${totalRows} registros.`;
    document.getElementById('btnPrev').disabled = currentPage === 1;
    document.getElementById('btnNext').disabled = currentPage === totalPages;
  }

  function changePage(delta) {
    currentPage += delta;
    renderTable();
  }

  function getStatusBadge(status) {
    const s = (status || "").toLowerCase();
    if (s.includes('contactado')) return 'badge-success';
    if (s.includes('no contesta') || s.includes('corte')) return 'badge-danger';
    return 'badge-warning';
  }

  function handleSearch(e) {
    if (e.key === 'Enter') executeSearch();
  }

  function executeSearch() {
    const rad = document.getElementById('smartSearch').value.trim();
    const resultDiv = document.getElementById('searchResult');

    if (!rad) {
      resultDiv.innerHTML = 'Ingrese un radicado';
      return;
    }

    const found = allData.find(d => d.radicado === rad);

    if (found) {
      resultDiv.innerHTML = `
        <div class="search-card-premium">
          <h4>${found.nombre}</h4>
          <div class="search-card-grid">
            <div><span>Radicado:</span> ${found.radicado}</div>
            <div><span>Asesor:</span> ${found.asesor || 'Sin asignar'}</div>
            <div><span>Empresa:</span> ${found.empresa}</div>
            <div><span>Estado:</span> ${found.estado}</div>
            <div><span>Canal:</span> ${found.canal}</div>
            <div><span>Efectividad:</span> ${found.efectividad}</div>
            <div><span>Fecha:</span> ${found.fechaCofrem}</div>
          </div>
        </div>
      `;
    } else {
      resultDiv.innerHTML = '<span class="text-red">Radicado no encontrado</span>';
    }
  }

  function generateInsights() {
    const total = filteredData.length;
    if (total === 0) {
      document.getElementById('autoInsight').textContent = "No hay datos suficientes para generar insights.";
      return;
    }

    const unmanaged = filteredData.filter(d => !d.isManaged).length;
    const unmanagedPerc = ((unmanaged / total) * 100).toFixed(1);

    const channelCounts = countBy(filteredData, 'canal');
    const topChannel = Object.keys(channelCounts).reduce((a, b) => channelCounts[a] > channelCounts[b] ? a : b);

    const statusCounts = countBy(filteredData, 'estado');
    const topStatus = Object.keys(statusCounts).reduce((a, b) => statusCounts[a] > statusCounts[b] ? a : b);

    let html = `
      <div style="display:flex; align-items:center; gap:10px">
        <i data-lucide="zap"></i>
        <div>
          <p>El <strong>${unmanagedPerc}%</strong> de los PQRSF no han sido gestionados.</p>
          <p>El canal más utilizado es <strong>${topChannel}</strong> con ${channelCounts[topChannel]} casos.</p>
          <p>El estado predominante es <strong>${topStatus}</strong>.</p>
        </div>
      </div>
    `;
    document.getElementById('autoInsight').innerHTML = html;
    lucide.createIcons();
  }

  function filterTable() {
    const query = document.getElementById('tableSearch').value.toLowerCase();
    const rows = document.getElementById('tableBody').getElementsByTagName('tr');

    for (let i = 0; i < rows.length; i++) {
      const text = rows[i].textContent.toLowerCase();
      rows[i].style.display = text.includes(query) ? "" : "none";
    }
  }

  function refreshData() {
    fetchData();
  }

  function exportToCSV() {
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Radicado,Nombre,Empresa,Estado,Canal,Efectividad\r\n";

    filteredData.forEach(row => {
      let r = [row.radicado, row.nombre, row.empresa, row.estado, row.canal, row.efectividad];
      csvContent += r.join(",") + "\r\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "pqrsf_data.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function exportToPDF() {
    window.print();
  }

  function handleSendReport() {
    const email = document.getElementById('reportEmail').value.trim();
    if (!email || !email.includes('@')) {
      alert("Por favor ingrese un correo válido.");
      return;
    }

    const total = filteredData.length;
    const managed = filteredData.filter(d => d.isManaged).length;
    const pending = total - managed;
    const effective = filteredData.filter(d => {
      const val = (d.efectividad || "").toLowerCase().trim();
      return val === 'sí' || val === 'si';
    }).length;

    const managedPerc = total > 0 ? ((managed / total) * 100).toFixed(1) : 0;
    const pendingPerc = total > 0 ? ((pending / total) * 100).toFixed(1) : 0;
    const effectivenessPerc = total > 0 ? ((effective / total) * 100).toFixed(1) : 0;

    const reportData = {
      total,
      managed,
      managedPerc,
      pending,
      pendingPerc,
      effectivenessPerc,
      channels: countBy(filteredData, 'canal'),
      status: countBy(filteredData, 'estado')
    };

    const today = new Date().toLocaleDateString('es-ES');
    const peopleStart = document.getElementById('filterDatePeopleStart').value;
    const peopleEnd = document.getElementById('filterDatePeopleEnd').value;

    let reportDate = today;
    if (peopleStart && peopleEnd) {
      reportDate = `${peopleStart} a ${peopleEnd}`;
    } else if (peopleStart || peopleEnd) {
      reportDate = peopleStart || peopleEnd;
    }

    toggleLoader(true);
    google.script.run
      .withSuccessHandler(() => {
        toggleLoader(false);
        alert("Reporte enviado con éxito.");
      })
      .withFailureHandler(err => {
        toggleLoader(false);
        alert("Error al enviar reporte: " + err.message);
      })
      .sendEmailReport(email, reportData, reportDate);
  }

  function sortTable(n) {
    const columns = ['radicado', 'nombre', 'empresa', 'estado', 'canal', 'efectividad'];
    const key = columns[n];

    // Update sort state
    if (currentSort.column === key) {
      currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.column = key;
      currentSort.direction = 'asc';
    }

    // Sort data
    filteredData.sort((a, b) => {
      let valA = a[key] || "";
      let valB = b[key] || "";

      if (typeof valA === 'string') valA = valA.toLowerCase();
      if (typeof valB === 'string') valB = valB.toLowerCase();

      if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
      if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
      return 0;
    });

    // Update UI headers
    const headers = document.querySelectorAll('th i');
    headers.forEach((icon, idx) => {
      if (idx === n) {
        icon.setAttribute('data-lucide', currentSort.direction === 'asc' ? 'chevron-up' : 'chevron-down');
      } else {
        icon.setAttribute('data-lucide', 'chevrons-up-down');
      }
    });
    lucide.createIcons();

    currentPage = 1;
    renderTable();
  }
</script>
