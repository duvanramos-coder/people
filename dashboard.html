<style>
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding: 24px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .avatar {
    width: 48px;
    height: 48px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    font-size: 1.2rem;
    color: white;
  }

  .user-details h2 {
    font-size: 1.25rem;
    margin-bottom: 2px;
  }

  .canal-badge {
    display: inline-block;
    padding: 2px 10px;
    background: rgba(99, 102, 241, 0.15);
    color: var(--primary);
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .header-actions {
    text-align: right;
  }

  .current-date {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .btn-logout {
    background: rgba(239, 68, 68, 0.1);
    color: var(--error);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover {
    background: var(--error);
    color: white;
  }

  /* Tabla de Turnos */
  .table-wrapper {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    margin-bottom: 40px;
  }

  .table-responsive {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    background: #1e293b;
    padding: 16px 24px;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    border-bottom: 1px solid #334155;
  }

  td {
    padding: 16px 24px;
    font-size: 0.9rem;
    border-bottom: 1px solid #334155;
    white-space: nowrap;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }

  /* Badges */
  .badge {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge-descanso {
    background: #475569;
    color: #f1f5f9;
  }

  .badge-asistencia {
    background: rgba(34, 197, 94, 0.15);
    color: var(--success);
  }

  .badge-empty {
    background: rgba(100, 116, 139, 0.15);
    color: var(--neutral);
  }

  .dia-cell {
    font-weight: 600;
    color: var(--text-main);
  }

  .fecha-cell {
    color: var(--text-muted);
  }

  /* Footer */
  .app-footer {
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .app-footer strong {
    color: var(--text-main);
  }

  /* Empty State */
  .empty-state {
    padding: 60px;
    text-align: center;
    color: var(--text-muted);
  }
</style>

<div class="dashboard-header">
  <div class="user-info">
    <div id="user-avatar" class="avatar"></div>
    <div class="user-details">
      <h2 id="display-name">Cargando...</h2>
      <span id="display-canal" class="canal-badge">Canal</span>
    </div>
  </div>
  <div class="header-actions">
    <div id="header-date" class="current-date"></div>
    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>
</div>

<div class="table-wrapper">
  <div class="table-responsive">
    <table id="turnos-table">
      <thead>
        <tr>
          <th>Día</th>
          <th>Fecha</th>
          <th>Horario</th>
          <th>Almuerzo</th>
          <th>Break Mañana</th>
          <th>Break Tarde</th>
          <th>Asistencia</th>
        </tr>
      </thead>
      <tbody id="turnos-body">
        <!-- Los datos se insertarán aquí -->
      </tbody>
    </table>
    <div id="empty-state" class="empty-state hidden">
      No se encontraron turnos registrados.
    </div>
  </div>
</div>

<div class="app-footer">
  Virtual Ramos <br>
  <strong>By Duvan Ramos</strong>
</div>

<script>
  function loadDashboardData() {
    const name = sessionStorage.getItem('userName');
    const canal = sessionStorage.getItem('userCanal');
    const userId = sessionStorage.getItem('userId');

    document.getElementById('display-name').innerText = name;
    document.getElementById('display-canal').innerText = canal;
    document.getElementById('user-avatar').innerText = name.charAt(0);

    // Fecha actual para el header
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('header-date').innerText = now.toLocaleDateString('es-ES', options);

    showLoader(true);

    google.script.run
      .withSuccessHandler(turnos => {
        renderTurnos(turnos);
        showLoader(false);
      })
      .withFailureHandler(err => {
        showLoader(false);
        showToast('Error al cargar turnos', true);
      })
      .obtenerTurnos(userId);
  }

  function renderTurnos(turnos) {
    const tbody = document.getElementById('turnos-body');
    const emptyState = document.getElementById('empty-state');
    tbody.innerHTML = '';

    if (!turnos || turnos.length === 0) {
      emptyState.classList.remove('hidden');
      return;
    }

    emptyState.classList.add('hidden');

    turnos.forEach(turno => {
      const tr = document.createElement('tr');

      const isDescanso = turno.horario && turno.horario.toUpperCase() === 'DESCANSO';
      const asistenciaBadge = turno.asistencia === 'SI'
        ? '<span class="badge badge-asistencia">SÍ</span>'
        : '<span class="badge badge-empty">-</span>';

      const horarioDisplay = isDescanso
        ? '<span class="badge badge-descanso">DESCANSO</span>'
        : (turno.horario || '-');

      tr.innerHTML = `
        <td class="dia-cell">${turno.dia}</td>
        <td class="fecha-cell">${turno.fecha}</td>
        <td>${horarioDisplay}</td>
        <td>${isDescanso ? '-' : (turno.almuerzo || '-')}</td>
        <td>${isDescanso ? '-' : (turno.breakMañana || '-')}</td>
        <td>${isDescanso ? '-' : (turno.breakTarde || '-')}</td>
        <td>${asistenciaBadge}</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>
